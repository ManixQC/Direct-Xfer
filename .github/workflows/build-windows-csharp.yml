name: Build Direct-Xfer Windows C# + Installer
run-name: v1.71.42

on:
  workflow_dispatch:
    inputs:
      sign_with_signpath:
        description: 'Sign this Windows release with SignPath Foundation (requires approved SignPath OSS setup)'
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'windows-launcher/**'
      - 'windows-server-host/**'
      - 'installer/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'lib/**'
      - 'public/**'
      - 'pwa/**'
      - 'scripts/**'
      - 'security/**'
      - 'test/**'
      - '.github/workflows/build-windows-csharp.yml'
      - '.github/scripts/**'
      - 'signpath/**'
      - 'CODE_SIGNING_POLICY.md'
      - 'PRIVACY.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: direct-xfer-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    env:
      DX_VERSION: '1.71.42'
      # Runtime identity is independent from the stable launcher component version.
      DX_RUNTIME_BUILD: 'runtime169'
      DX_LAUNCHER_COMPONENT_VERSION: '1.70.1'
      DX_SERVER_HOST_COMPONENT_VERSION: '1.70.22'
      DX_DOTNET_RUNTIME_VERSION: '10.0.11'
      DX_DOTNET_RUNTIME_ZIP_SHA512: 'd9ab9c0d9916b8fa3585b5f403057f594ffffb8364dac09e0007dd8ac671c86754935b980d8fb5da83cb1b82ac3cd57cc407c969e6d837aaa2fae21047cb7448'
      DX_NODE_VERSION: '24.19.0'
      DX_NODE_EXE_SHA256: '3602f2bb1a10f2cbab4c36886218a33c1ab3db87290e73b033c46c77147d0237'
      DX_NODE_MODULES_BUDGET_MB: '15'
      INNO_VERSION: '6.7.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=moderate
      - name: Remove obsolete .NET Framework config files
        shell: pwsh
        run: |
          Remove-Item 'windows-launcher\App.config','windows-server-host\App.config' -Force -ErrorAction SilentlyContinue
      - name: Validate source and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.js -File | Where-Object { $_.FullName -notmatch '\\node_modules\\' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failure: $($_.FullName)" }
          }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Direct-Xfer tests failed with exit code $LASTEXITCODE" }
      - name: Publish C# applications on .NET 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $PWD 'build\windows-dotnet10'
          $hostOut = Join-Path $buildRoot 'server-host'
          $launcherOut = Join-Path $buildRoot 'launcher'
          Remove-Item $buildRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $hostOut,$launcherOut | Out-Null
          dotnet publish windows-server-host\DirectXfer.ServerHost.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:AppHostDotNetSearch=AppRelative -p:AppHostRelativeDotNet=runtime\dotnet -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true -p:InformationalVersion=$env:DX_VERSION -p:DebugSymbols=false -p:DebugType=None -o $hostOut
          if ($LASTEXITCODE -ne 0) { throw "ServerHost .NET 10 publish failed: $LASTEXITCODE" }
          dotnet publish windows-launcher\DirectXfer.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:AppHostDotNetSearch=AppRelative -p:AppHostRelativeDotNet=runtime\dotnet -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true -p:InformationalVersion=$env:DX_VERSION -p:DebugSymbols=false -p:DebugType=None -o $launcherOut
          if ($LASTEXITCODE -ne 0) { throw "Launcher .NET 10 publish failed: $LASTEXITCODE" }

          # Framework-dependent single-file apphosts keep app dependencies bundled while using one private shared runtime.
          foreach ($entry in @(
            @{ Name = 'ServerHost'; Dir = $hostOut; Exe = 'Direct-Xfer.ServerHost.exe' },
            @{ Name = 'Launcher'; Dir = $launcherOut; Exe = 'Direct-Xfer.exe' }
          )) {
            $files = @(Get-ChildItem -LiteralPath $entry.Dir -Recurse -File)
            if ($files.Count -ne 1 -or $files[0].Name -ne $entry.Exe) {
              throw "$($entry.Name) publish is not single-file: $($files.Name -join ', ')"
            }
          }

          # Rebuild the launcher from identical sources into a second directory and require
          # byte-for-byte determinism. App-only releases may still run this workflow, but an
          # unchanged launcher must keep the same SHA-256 rather than acquiring a new identity.
          $launcherRepeatOut = Join-Path $buildRoot 'launcher-repeat'
          New-Item -ItemType Directory -Force -Path $launcherRepeatOut | Out-Null
          # Force a genuinely clean second compile. Without clearing bin/obj, dotnet publish
          # may reuse the first invocation's intermediate assembly and make this check vacuous.
          Remove-Item 'windows-launcher\bin','windows-launcher\obj' -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish windows-launcher\DirectXfer.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:AppHostDotNetSearch=AppRelative -p:AppHostRelativeDotNet=runtime\dotnet -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true -p:InformationalVersion=$env:DX_VERSION -p:DebugSymbols=false -p:DebugType=None -o $launcherRepeatOut
          if ($LASTEXITCODE -ne 0) { throw "Launcher repeat .NET 10 publish failed: $LASTEXITCODE" }
          $launcherPrimary = Join-Path $launcherOut 'Direct-Xfer.exe'
          $launcherRepeat = Join-Path $launcherRepeatOut 'Direct-Xfer.exe'
          $launcherPrimaryHash = (Get-FileHash -Algorithm SHA256 $launcherPrimary).Hash.ToLowerInvariant()
          $launcherRepeatHash = (Get-FileHash -Algorithm SHA256 $launcherRepeat).Hash.ToLowerInvariant()
          if ($launcherPrimaryHash -ne $launcherRepeatHash) {
            throw "Direct-Xfer launcher build is not deterministic: $launcherPrimaryHash != $launcherRepeatHash"
          }
          Write-Host "Stable launcher deterministic SHA-256: $launcherPrimaryHash"
      - name: Verify freshly built executables before signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            @{ Path='build\windows-dotnet10\launcher\Direct-Xfer.exe'; FileVersion="$env:DX_LAUNCHER_COMPONENT_VERSION.0" },
            @{ Path='build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe'; FileVersion="$env:DX_SERVER_HOST_COMPONENT_VERSION.0" }
          )
          foreach ($entry in $expected) {
            $exe = $entry.Path
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing $exe" }
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            if ($sig.Status -ne 'NotSigned') { throw "Fresh build must be unsigned before SignPath processing; $exe status=$($sig.Status)" }
            $versionInfo = (Get-Item -LiteralPath $exe).VersionInfo
            if ($versionInfo.ProductName -ne 'Direct-Xfer') { throw "$exe ProductName '$($versionInfo.ProductName)' is not Direct-Xfer." }
            if ($versionInfo.ProductVersion -ne $env:DX_VERSION) { throw "$exe ProductVersion '$($versionInfo.ProductVersion)' does not match release $env:DX_VERSION." }
            if ($versionInfo.FileVersion -ne $entry.FileVersion) { throw "$exe FileVersion '$($versionInfo.FileVersion)' does not match component version $($entry.FileVersion)." }
            if ($versionInfo.CompanyName -ne 'Direct-Xfer') { throw "$exe CompanyName '$($versionInfo.CompanyName)' is not Direct-Xfer." }
          }
      - name: Create portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-DxDownload([string]$Uri, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing -TimeoutSec 180
                if (-not (Test-Path -LiteralPath $OutFile -PathType Leaf) -or (Get-Item -LiteralPath $OutFile).Length -le 0) {
                  throw "Downloaded file is missing or empty: $OutFile"
                }
                return
              } catch {
                if ($attempt -ge 3) { throw }
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }
          $distRoot = Join-Path $PWD 'dist'
          $dist = Join-Path $distRoot "Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $app = Join-Path $dist 'runtime\app'
          $dotnetRuntime = Join-Path $dist 'runtime\dotnet'
          $nodeRuntime = Join-Path $dist 'runtime\node'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $app,$dotnetRuntime,$nodeRuntime | Out-Null
          Copy-Item 'build\windows-dotnet10\launcher\Direct-Xfer.exe' $dist
          Copy-Item 'build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe' $dist
          Copy-Item 'windows-launcher\README-WINDOWS-PORTABLE.md' (Join-Path $dist 'README-WINDOWS-PORTABLE.md')
          Copy-Item 'LICENSE' (Join-Path $dist 'LICENSE.txt')
          Copy-Item @('package.json','package-lock.json','server.js') $app
          Copy-Item @('lib','public','pwa','scripts','security') $app -Recurse

          # Build a dedicated production dependency tree. Never copy the workspace's
          # test/development node_modules into the Windows runtime: future devDependencies
          # must not silently inflate the installer. npm ci keeps this tree locked to
          # package-lock.json; the conservative metadata prune keeps runtime code/licenses.
          $repoRoot = $PWD.Path
          Push-Location $app
          try {
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Production node_modules install failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $runtimeNodeModules = Join-Path $app 'node_modules'
          & (Join-Path $repoRoot '.github\scripts\prune-windows-node-modules.ps1') -NodeModulesPath $runtimeNodeModules

          # Import every direct production dependency from the pruned tree. This catches an
          # over-aggressive prune before the package reaches Inno Setup. Dynamic import works
          # for both CommonJS dependencies and Archiver 8's ESM entrypoint.
          $moduleProbe = @(
            "(async () => {",
            "  const dependencies = Object.keys(require('./package.json').dependencies || {});",
            "  for (const name of dependencies) await import(name);",
            "  console.log('Direct-Xfer runtime module probe OK: ' + dependencies.join(', '));",
            "})().catch((error) => { console.error(error); process.exit(1); });"
          ) -join "`n"
          Push-Location $app
          try {
            node -e $moduleProbe
            if ($LASTEXITCODE -ne 0) { throw "Pruned node_modules runtime probe failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $runtimeNodeModulesBytes = (Get-ChildItem -LiteralPath $runtimeNodeModules -Recurse -File -Force | Measure-Object Length -Sum).Sum
          $runtimeNodeModulesBudget = [int64]$env:DX_NODE_MODULES_BUDGET_MB * 1MB
          if ([int64]$runtimeNodeModulesBytes -gt $runtimeNodeModulesBudget) {
            throw ("node_modules runtime exceeds the Direct-Xfer size budget: {0:N1} MiB > {1} MiB" -f ($runtimeNodeModulesBytes / 1MB), $env:DX_NODE_MODULES_BUDGET_MB)
          }

          $marker = Join-Path $app 'runtime-build.txt'
          # Use File.WriteAllText instead of positional Set-Content binding. This is deterministic
          # on Windows PowerShell/PowerShell 7 and guarantees that the marker is materialized
          # before the portable package is validated or passed to Inno Setup.
          [System.IO.File]::WriteAllText($marker, [string]$env:DX_RUNTIME_BUILD, [System.Text.Encoding]::ASCII)
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Failed to create runtime marker: $marker" }
          $markerNow = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($markerNow -ne $env:DX_RUNTIME_BUILD) { throw "Runtime marker write mismatch: '$markerNow' != '$env:DX_RUNTIME_BUILD'" }
          # Build one private .NET 10 runtime tree shared by both framework-dependent
          # single-file apphosts. The launcher uses native Win32 UI APIs, so Direct-Xfer no
          # longer needs Microsoft.WindowsDesktop.App or the WindowsDesktop runtime archive.
          $dotnetBaseRuntimeZip = Join-Path $env:RUNNER_TEMP "dotnet-runtime-$env:DX_DOTNET_RUNTIME_VERSION-win-x64.zip"
          $dotnetBaseRuntimeUrl = "https://builds.dotnet.microsoft.com/dotnet/Runtime/$env:DX_DOTNET_RUNTIME_VERSION/dotnet-runtime-$env:DX_DOTNET_RUNTIME_VERSION-win-x64.zip"
          Invoke-DxDownload $dotnetBaseRuntimeUrl $dotnetBaseRuntimeZip
          $dotnetBaseRuntimeHash = (Get-FileHash -Algorithm SHA512 $dotnetBaseRuntimeZip).Hash.ToLowerInvariant()
          if ($dotnetBaseRuntimeHash -ne $env:DX_DOTNET_RUNTIME_ZIP_SHA512) { throw "Private .NET Runtime SHA-512 mismatch: $dotnetBaseRuntimeHash" }
          Expand-Archive -LiteralPath $dotnetBaseRuntimeZip -DestinationPath $dotnetRuntime -Force

          $privateDotnetExe = Join-Path $dotnetRuntime 'dotnet.exe'
          $privateCore = Join-Path $dotnetRuntime "shared\Microsoft.NETCore.App\$env:DX_DOTNET_RUNTIME_VERSION"
          $privateHostFxr = Join-Path $dotnetRuntime "host\fxr\$env:DX_DOTNET_RUNTIME_VERSION\hostfxr.dll"
          foreach ($required in @($privateDotnetExe,$privateCore,$privateHostFxr)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Incomplete private .NET runtime: missing $required" }
          }
          $retiredDesktop = Join-Path $dotnetRuntime 'shared\Microsoft.WindowsDesktop.App'
          if (Test-Path -LiteralPath $retiredDesktop) { throw "Microsoft.WindowsDesktop.App leaked into the base Direct-Xfer runtime: $retiredDesktop" }
          $privateRuntimeOutput = @(& $privateDotnetExe --list-runtimes 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Private dotnet runtime probe failed: $LASTEXITCODE" }
          $privateRuntimeLines = @($privateRuntimeOutput | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          $escapedDotnetVersion = [regex]::Escape($env:DX_DOTNET_RUNTIME_VERSION)
          if (-not ($privateRuntimeLines | Where-Object { $_ -match "^Microsoft\.NETCore\.App\s+$escapedDotnetVersion\s+\[" })) { throw "Private runtime is missing Microsoft.NETCore.App $env:DX_DOTNET_RUNTIME_VERSION" }
          if ($privateRuntimeLines | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App\s+' }) { throw 'Private runtime unexpectedly exposes Microsoft.WindowsDesktop.App.' }
          [System.IO.File]::WriteAllLines((Join-Path $dotnetRuntime 'DIRECT-XFER-README.txt'), @(
            "Direct-Xfer private shared .NET 10 runtime tree $env:DX_DOTNET_RUNTIME_VERSION x64",
            "Base Runtime SHA-512: $dotnetBaseRuntimeHash",
            "Base Runtime source: $dotnetBaseRuntimeUrl",
            "Microsoft.WindowsDesktop.App: not bundled (launcher uses native Win32 UI)",
            "Used by both Direct-Xfer.exe and Direct-Xfer.ServerHost.exe via AppHostDotNetSearch=AppRelative"
          ), [System.Text.Encoding]::UTF8)

          # Bundle one pinned x64 Node.js executable directly in the Windows payload.
          # The installer itself performs no Node.js network access; this restores the passive
          # installer model while keeping rclone/Tesseract as opt-in post-install components.
          $nodeExe = Join-Path $nodeRuntime 'node.exe'
          $nodeUrl = "https://nodejs.org/download/release/v$env:DX_NODE_VERSION/win-x64/node.exe"
          Invoke-DxDownload $nodeUrl $nodeExe
          $nodeHash = (Get-FileHash -Algorithm SHA256 $nodeExe).Hash.ToLowerInvariant()
          if ($nodeHash -ne $env:DX_NODE_EXE_SHA256) { throw "Bundled Node.js SHA-256 mismatch: $nodeHash" }
          $nodeVersionOutput = ((& $nodeExe --version 2>&1 | Select-Object -First 1) -as [string]).Trim().TrimStart('v')
          if ($LASTEXITCODE -ne 0 -or $nodeVersionOutput -ne $env:DX_NODE_VERSION) {
            throw "Bundled Node.js version probe mismatch: '$nodeVersionOutput' != '$env:DX_NODE_VERSION'"
          }

          Write-Host ("Direct-Xfer optimized Windows payload: node_modules={0:N1} MiB; Node {1} bundled; optional rclone/Tesseract excluded" -f ($runtimeNodeModulesBytes / 1MB), $env:DX_NODE_VERSION)
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
              '### Direct-Xfer Windows runtime footprint',
              "- production node_modules: $([math]::Round($runtimeNodeModulesBytes / 1MB, 1)) MiB (hard budget $env:DX_NODE_MODULES_BUDGET_MB MiB)",
              "- Node.js $env:DX_NODE_VERSION: bundled in runtime/node/node.exe (SHA-256 $nodeHash)",
              '- rclone: optional, downloaded after activation (not bundled)',
              '- Tesseract OCR: optional, downloaded after activation (not bundled)'
            )
          }

          # Re-materialize the marker as the final operation of package assembly so later
          # validation cannot observe a partially prepared runtime tree.
          [System.IO.File]::WriteAllText($marker, [string]$env:DX_RUNTIME_BUILD, [System.Text.Encoding]::ASCII)
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Runtime marker disappeared during package assembly: $marker" }
      - name: Verify shared private .NET 10 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $privateDotnetRoot = Join-Path $dist 'runtime\dotnet'
          $privateDotnetExe = Join-Path $privateDotnetRoot 'dotnet.exe'
          if (-not (Test-Path -LiteralPath $privateDotnetExe -PathType Leaf)) { throw "Missing private .NET host: $privateDotnetExe" }
          $emptyDotnetRoot = Join-Path $env:RUNNER_TEMP 'dx-empty-global-dotnet-root'
          Remove-Item $emptyDotnetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $emptyDotnetRoot | Out-Null
          $previousDotnetRoot = $env:DOTNET_ROOT
          $previousDotnetRootX64 = $env:DOTNET_ROOT_X64
          $previousMultilevel = $env:DOTNET_MULTILEVEL_LOOKUP
          $previousHostTrace = $env:DOTNET_HOST_TRACE
          $previousHostTraceFile = $env:DOTNET_HOST_TRACEFILE
          $previousHostTraceVerbosity = $env:DOTNET_HOST_TRACE_VERBOSITY
          try {
            # AppHostDotNetSearch=AppRelative is intended to bind both EXEs to the private
            # runtime beside them. Do not rely only on a successful managed-code probe:
            # actions/setup-dotnet also places a machine/user runtime on the runner. .NET 10
            # host tracing lets CI prove that hostfxr was actually loaded from runtime\dotnet.
            $env:DOTNET_ROOT = $emptyDotnetRoot
            $env:DOTNET_ROOT_X64 = $emptyDotnetRoot
            $env:DOTNET_MULTILEVEL_LOOKUP = '0'
            $env:DOTNET_HOST_TRACE = '1'
            $env:DOTNET_HOST_TRACE_VERBOSITY = '4'
            $privateRootNormalized = ([System.IO.Path]::GetFullPath($privateDotnetRoot)).Replace('/', '\').TrimEnd('\').ToLowerInvariant()
            $expectedHostFxr = Join-Path $privateDotnetRoot "host\fxr\$env:DX_DOTNET_RUNTIME_VERSION\hostfxr.dll"
            $expectedHostFxrNormalized = ([System.IO.Path]::GetFullPath($expectedHostFxr)).Replace('/', '\').ToLowerInvariant()
            foreach ($exeName in @('Direct-Xfer.exe','Direct-Xfer.ServerHost.exe')) {
              $exe = Join-Path $dist $exeName
              $safeName = [System.IO.Path]::GetFileNameWithoutExtension($exeName).Replace('.', '-')
              $traceFile = Join-Path $env:RUNNER_TEMP ("dx-dotnet-host-$safeName.log")
              Remove-Item -LiteralPath $traceFile -Force -ErrorAction SilentlyContinue
              $env:DOTNET_HOST_TRACEFILE = $traceFile
              $process = Start-Process -FilePath $exe -ArgumentList '--dx-runtime-probe' -WorkingDirectory $dist -PassThru
              if (-not $process.WaitForExit(15000)) {
                try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
                throw "$exeName timed out during the shared private .NET runtime probe."
              }
              if ($process.ExitCode -ne 0) { throw "$exeName failed the shared private .NET runtime probe: $($process.ExitCode)" }
              if (-not (Test-Path -LiteralPath $traceFile -PathType Leaf)) { throw "$exeName did not produce a .NET host trace." }
              $traceNormalized = (Get-Content -LiteralPath $traceFile -Raw).Replace('/', '\').ToLowerInvariant()
              if (-not $traceNormalized.Contains($privateRootNormalized)) {
                throw "$exeName reached managed code but its .NET host trace did not reference the packaged runtime root."
              }
              $resolvedHostFxrMarker = "resolved fxr [$expectedHostFxrNormalized]"
              $loadedHostFxrMarker = "loaded library from $expectedHostFxrNormalized"
              if (-not ($traceNormalized.Contains($resolvedHostFxrMarker) -or $traceNormalized.Contains($loadedHostFxrMarker))) {
                throw "$exeName did not resolve/load hostfxr from the pinned private .NET $env:DX_DOTNET_RUNTIME_VERSION runtime."
              }
            }
          } finally {
            $env:DOTNET_ROOT = $previousDotnetRoot
            $env:DOTNET_ROOT_X64 = $previousDotnetRootX64
            $env:DOTNET_MULTILEVEL_LOOKUP = $previousMultilevel
            $env:DOTNET_HOST_TRACE = $previousHostTrace
            $env:DOTNET_HOST_TRACEFILE = $previousHostTraceFile
            $env:DOTNET_HOST_TRACE_VERBOSITY = $previousHostTraceVerbosity
          }
      - name: Verify portable runtime layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $app = Join-Path $dist 'runtime\app'
          $marker = Join-Path $app 'runtime-build.txt'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Missing runtime marker: $marker" }
          $markerValue = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($markerValue -ne $env:DX_RUNTIME_BUILD) { throw "Runtime marker mismatch: '$markerValue' != '$env:DX_RUNTIME_BUILD'" }
          foreach ($rel in @('package.json','server.js','public\app.js','node_modules\express\package.json')) {
            $file = Join-Path $app $rel
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing runtime file: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty runtime file: $file" }
          }
          $privateDotnetRoot = Join-Path $dist 'runtime\dotnet'
          $privateDotnetExe = Join-Path $privateDotnetRoot 'dotnet.exe'
          $privateCore = Join-Path $privateDotnetRoot "shared\Microsoft.NETCore.App\$env:DX_DOTNET_RUNTIME_VERSION"
          foreach ($required in @($privateDotnetExe,$privateCore)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing private shared .NET runtime component: $required" }
          }
          $retiredDesktop = Join-Path $privateDotnetRoot 'shared\Microsoft.WindowsDesktop.App'
          if (Test-Path -LiteralPath $retiredDesktop) { throw "Microsoft.WindowsDesktop.App must not be present in the portable runtime: $retiredDesktop" }
          $privateRuntimeOutput = @(& $privateDotnetExe --list-runtimes 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Private .NET runtime layout probe failed: $LASTEXITCODE" }
          $privateRuntimeText = (($privateRuntimeOutput | ForEach-Object { [string]$_ }) -join "`n")
          $escapedDotnetVersion = [regex]::Escape($env:DX_DOTNET_RUNTIME_VERSION)
          if ($privateRuntimeText -notmatch "(?m)^Microsoft\.NETCore\.App\s+$escapedDotnetVersion\s+\[") { throw 'Private runtime does not expose the pinned Microsoft.NETCore.App.' }
          if ($privateRuntimeText -match "(?m)^Microsoft\.WindowsDesktop\.App\s+") { throw 'Private runtime unexpectedly exposes Microsoft.WindowsDesktop.App.' }
          $nodeExe = Join-Path $dist 'runtime\node\node.exe'
          if (-not (Test-Path -LiteralPath $nodeExe -PathType Leaf)) { throw "Missing bundled Node.js runtime: $nodeExe" }
          $nodeHash = (Get-FileHash -Algorithm SHA256 $nodeExe).Hash.ToLowerInvariant()
          if ($nodeHash -ne $env:DX_NODE_EXE_SHA256) { throw "Bundled Node.js payload SHA-256 mismatch: $nodeHash" }
          $nodeVersionOutput = ((& $nodeExe --version 2>&1 | Select-Object -First 1) -as [string]).Trim().TrimStart('v')
          if ($LASTEXITCODE -ne 0 -or $nodeVersionOutput -ne $env:DX_NODE_VERSION) { throw "Bundled Node.js payload version mismatch: $nodeVersionOutput" }
          if (Test-Path -LiteralPath (Join-Path $dist 'runtime\node\external-node.ini')) { throw 'Obsolete external Node.js receipt leaked into the portable payload.' }
          foreach ($optionalRel in @('runtime\rclone','runtime\tesseract')) {
            $optionalPath = Join-Path $dist $optionalRel
            if (Test-Path -LiteralPath $optionalPath) {
              throw "Optional Windows component leaked into the default payload: $optionalPath"
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_VERSION.exe"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile $installer -UseBasicParsing -TimeoutSec 180
              if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or (Get-Item -LiteralPath $installer).Length -le 0) { throw 'Inno Setup download is missing or empty.' }
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid') { throw "Invalid Inno Setup signature: $($sig.Status)" }
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $innoInstall = Start-Process $installer -ArgumentList '/VERYSILENT',('/DIR='+$dir),'/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $innoInstall.WaitForExit(120000)) {
            try { Stop-Process -Id $innoInstall.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw 'Inno Setup installation timed out after 120 seconds.'
          }
          if ($innoInstall.ExitCode -ne 0) { throw "Inno Setup installation failed: $($innoInstall.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Inno Setup compiler is missing after installation: $iscc" }
          "DX_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DX_INNO_APP_VERSION = $env:DX_VERSION
          $env:DX_INNO_DOTNET_RUNTIME_VERSION = $env:DX_DOTNET_RUNTIME_VERSION
          $env:DX_INNO_NODE_VERSION = $env:DX_NODE_VERSION
          $env:DX_INNO_NODE_EXE_SHA256 = $env:DX_NODE_EXE_SHA256
          $env:DX_INNO_SOURCE_DIR = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $env:DX_INNO_OUTPUT_DIR = Join-Path $PWD 'dist\installer'
          & $env:DX_ISCC 'installer\Direct-Xfer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Verify unsigned Windows preview artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $setup = Join-Path $PWD "dist\installer\Direct-Xfer-Setup-$env:DX_VERSION.exe"
          $files = @(
            (Join-Path $portable 'Direct-Xfer.exe'),
            (Join-Path $portable 'Direct-Xfer.ServerHost.exe'),
            $setup
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing unsigned preview artifact: $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') { throw "Unsigned preview must not already be signed: $file status=$($sig.Status)" }
          }
          $unsignedSetup = Join-Path $PWD "dist\installer\Direct-Xfer-Setup-$env:DX_VERSION-UNSIGNED.exe"
          Copy-Item -LiteralPath $setup -Destination $unsignedSetup -Force
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
              '### Unsigned Windows preview artifacts',
              "- Direct-Xfer $env:DX_VERSION unsigned portable preview is available immediately.",
              "- Direct-Xfer-Setup-$env:DX_VERSION-UNSIGNED.exe is intentionally unsigned and may be blocked by Windows Smart App Control.",
              '- Signed release artifacts, when requested, are published separately only after SignPath and Authenticode validation.'
            )
          }

      - name: Upload unsigned portable Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp-UNSIGNED
          path: dist/Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned installer preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Direct-Xfer-Setup-${{ env.DX_VERSION }}-UNSIGNED
          path: dist/installer/Direct-Xfer-Setup-${{ env.DX_VERSION }}-UNSIGNED.exe
          if-no-files-found: error
          retention-days: 14

      - name: Validate SignPath Foundation configuration
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw ('SignPath signing was requested but these GitHub repository settings are missing: ' + ($missing -join ', '))
          }

          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'SignPath release signing is allowed only from an explicit workflow_dispatch run.'
          }
          if ($env:GITHUB_REPOSITORY -ne 'ManixQC/Direct-Xfer') {
            throw "SignPath release signing is restricted to ManixQC/Direct-Xfer, not '$env:GITHUB_REPOSITORY'."
          }
          $allowedRefs = @('refs/heads/main', "refs/tags/v$env:DX_VERSION")
          if ($allowedRefs -notcontains $env:GITHUB_REF) {
            throw "SignPath release signing is allowed only from main or refs/tags/v$env:DX_VERSION; current ref is '$env:GITHUB_REF'."
          }

          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $lock = Get-Content -LiteralPath 'package-lock.json' -Raw | ConvertFrom-Json
          $broker = Get-Content -LiteralPath 'oauth-broker/package.json' -Raw | ConvertFrom-Json
          $worker = Get-Content -LiteralPath 'oauth-broker/cloudflare-worker/package.json' -Raw | ConvertFrom-Json
          foreach ($entry in @(
            @{ Name='package.json'; Version=[string]$package.version },
            @{ Name='package-lock.json'; Version=[string]$lock.version },
            @{ Name='package-lock root'; Version=[string]$lock.packages.PSObject.Properties[''].Value.version },
            @{ Name='oauth-broker/package.json'; Version=[string]$broker.version },
            @{ Name='oauth-broker/cloudflare-worker/package.json'; Version=[string]$worker.version }
          )) {
            if ($entry.Version -ne $env:DX_VERSION) {
              throw "$($entry.Name) version '$($entry.Version)' does not match release $env:DX_VERSION."
            }
          }

      # After the clearly labelled unsigned preview artifacts have been published,
      # submit Direct-Xfer's launcher and ServerHost to SignPath. The action may wait
      # for manual approval while the unsigned previews remain immediately downloadable.
      - name: Upload Direct-Xfer executables for SignPath
        if: ${{ inputs.sign_with_signpath }}
        id: upload-signpath-executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _signpath-input-executables-${{ env.DX_VERSION }}
          path: |
            build/windows-dotnet10/launcher/Direct-Xfer.exe
            build/windows-dotnet10/server-host/Direct-Xfer.ServerHost.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Direct-Xfer executables with SignPath Foundation
        if: ${{ inputs.sign_with_signpath }}
        id: signpath-executables
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-signpath-executables.outputs.artifact-id }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'build/signpath-signed-executables'
          parameters: |
            version: "${{ env.DX_VERSION }}"
            launcherFileVersion: "${{ env.DX_LAUNCHER_COMPONENT_VERSION }}"
            serverHostFileVersion: "${{ env.DX_SERVER_HOST_COMPONENT_VERSION }}"

      - name: Install SignPath-signed Direct-Xfer executables into build tree
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedRoot = Join-Path $PWD 'build\signpath-signed-executables'
          $portableRoot = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $targets = @(
            @{ Name = 'Direct-Xfer.exe'; Destinations = @((Join-Path $PWD 'build\windows-dotnet10\launcher\Direct-Xfer.exe'), (Join-Path $portableRoot 'Direct-Xfer.exe')) },
            @{ Name = 'Direct-Xfer.ServerHost.exe'; Destinations = @((Join-Path $PWD 'build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe'), (Join-Path $portableRoot 'Direct-Xfer.ServerHost.exe')) }
          )
          foreach ($target in $targets) {
            $matches = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $target.Name)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one SignPath output named $($target.Name), found $($matches.Count)."
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "SignPath returned an invalid signature for $($target.Name): $($sig.Status)"
            }
            foreach ($destination in $target.Destinations) {
              Copy-Item -LiteralPath $matches[0].FullName -Destination $destination -Force
            }
          }

      - name: Verify SignPath-signed Direct-Xfer executables
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableRoot = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          foreach ($exe in @(
            'build\windows-dotnet10\launcher\Direct-Xfer.exe',
            'build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe',
            (Join-Path $portableRoot 'Direct-Xfer.exe'),
            (Join-Path $portableRoot 'Direct-Xfer.ServerHost.exe')
          )) {
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "Expected a valid SignPath Authenticode signature on $exe; status=$($sig.Status)"
            }
            Write-Host "$exe signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Rebuild installer with SignPath-signed executables
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DX_INNO_APP_VERSION = $env:DX_VERSION
          $env:DX_INNO_DOTNET_RUNTIME_VERSION = $env:DX_DOTNET_RUNTIME_VERSION
          $env:DX_INNO_NODE_VERSION = $env:DX_NODE_VERSION
          $env:DX_INNO_NODE_EXE_SHA256 = $env:DX_NODE_EXE_SHA256
          $env:DX_INNO_SOURCE_DIR = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $env:DX_INNO_OUTPUT_DIR = Join-Path $PWD 'dist\installer'
          $setup = Join-Path $env:DX_INNO_OUTPUT_DIR "Direct-Xfer-Setup-$env:DX_VERSION.exe"
          Remove-Item -LiteralPath $setup -Force -ErrorAction SilentlyContinue
          & $env:DX_ISCC 'installer\Direct-Xfer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Signed-input Inno Setup rebuild failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Signed-input installer rebuild did not produce $setup" }

      - name: Verify installer is ready for SignPath
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD "dist\installer\Direct-Xfer-Setup-$env:DX_VERSION.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Missing installer: $setup" }
          $sig = Get-AuthenticodeSignature -LiteralPath $setup
          if ($sig.Status -ne 'NotSigned') { throw "Installer must be unsigned before SignPath processing; status=$($sig.Status)" }

      - name: Upload Direct-Xfer installer for SignPath
        if: ${{ inputs.sign_with_signpath }}
        id: upload-signpath-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _signpath-input-installer-${{ env.DX_VERSION }}
          path: dist/installer/Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Direct-Xfer installer with SignPath Foundation
        if: ${{ inputs.sign_with_signpath }}
        id: signpath-installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-signpath-installer.outputs.artifact-id }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'dist/signpath-signed-installer'
          parameters: |
            version: "${{ env.DX_VERSION }}"

      - name: Replace installer with SignPath-signed release
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedRoot = Join-Path $PWD 'dist\signpath-signed-installer'
          $expectedName = "Direct-Xfer-Setup-$env:DX_VERSION.exe"
          $matches = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $expectedName)
          if ($matches.Count -ne 1) { throw "Expected exactly one signed installer named $expectedName, found $($matches.Count)." }
          $sig = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
            throw "SignPath returned an invalid installer signature: $($sig.Status)"
          }
          $destination = Join-Path $PWD "dist\installer\$expectedName"
          Copy-Item -LiteralPath $matches[0].FullName -Destination $destination -Force

      - name: Verify final SignPath release signatures
        if: ${{ inputs.sign_with_signpath }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $files = @(
            (Join-Path $dist 'Direct-Xfer.exe'),
            (Join-Path $dist 'Direct-Xfer.ServerHost.exe'),
            (Join-Path $PWD "dist\installer\Direct-Xfer-Setup-$env:DX_VERSION.exe")
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "Final SignPath signature validation failed for $file; status=$($sig.Status)"
            }
            Write-Host "$file -> $($sig.SignerCertificate.Subject)"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
              '### SignPath Foundation signing',
              "- Direct-Xfer $env:DX_VERSION launcher: Authenticode valid",
              "- Direct-Xfer $env:DX_VERSION ServerHost: Authenticode valid",
              "- Direct-Xfer $env:DX_VERSION installer: Authenticode valid",
              '- Signing requests are origin-verified by SignPath and manually approved under the project code signing policy.'
            )
          }

      # Canonical release artifact names are reserved for the SignPath-validated path.
      # Unsigned previews were already uploaded earlier under explicit -UNSIGNED names.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.sign_with_signpath }}
        with:
          name: Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp
          path: dist/Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp/**
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.sign_with_signpath }}
        with:
          name: Direct-Xfer-Setup-${{ env.DX_VERSION }}
          path: dist/installer/Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe
          if-no-files-found: error

  attest-windows-provenance:
    name: Attest Windows release provenance
    # Provenance for Windows release binaries is meaningful only for the explicit
    # signed release path. Never attest unsigned push-CI binaries.
    if: ${{ github.repository == 'ManixQC/Direct-Xfer' && github.event_name == 'workflow_dispatch' && inputs.sign_with_signpath }}
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DX_VERSION: '1.71.42'
    # Keep OIDC/attestation privileges out of the build/signing job. This job only
    # reads the final immutable Actions artifacts and creates GitHub attestations.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout release SBOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provenance/source

      - name: Create SBOM-described source package
        shell: bash
        run: |
          set -euo pipefail
          git -C provenance/source archive \
            --format=zip \
            --prefix="Direct-Xfer-${DX_VERSION}/" \
            --output="../Direct-Xfer-${DX_VERSION}-source.zip" \
            HEAD
          test -s "provenance/Direct-Xfer-${DX_VERSION}-source.zip"
          unzip -tq "provenance/Direct-Xfer-${DX_VERSION}-source.zip"
          node -e "const p=require('./provenance/source/package.json'); if(p.version !== process.env.DX_VERSION) process.exit(1)"

      - name: Download portable Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp
          path: provenance/portable

      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Direct-Xfer-Setup-${{ env.DX_VERSION }}
          path: provenance/installer

      - name: Validate attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t launchers < <(find provenance/portable -type f -name 'Direct-Xfer.exe' -size +0c)
          mapfile -t hosts < <(find provenance/portable -type f -name 'Direct-Xfer.ServerHost.exe' -size +0c)
          mapfile -t installers < <(find provenance/installer -type f -name "Direct-Xfer-Setup-${DX_VERSION}.exe" -size +0c)
          [[ ${#launchers[@]} -eq 1 ]] || { echo "Expected exactly one launcher attestation subject, found ${#launchers[@]}" >&2; exit 1; }
          [[ ${#hosts[@]} -eq 1 ]] || { echo "Expected exactly one ServerHost attestation subject, found ${#hosts[@]}" >&2; exit 1; }
          [[ ${#installers[@]} -eq 1 ]] || { echo "Expected exactly one installer attestation subject, found ${#installers[@]}" >&2; exit 1; }
          node -e "const s=require('./provenance/source/security/sbom.cdx.json'); if(s?.metadata?.component?.version !== process.env.DX_VERSION) process.exit(1)"

      - name: Generate release SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=provenance/Direct-Xfer-${DX_VERSION}-SHA256SUMS.txt
          : > "$manifest"
          (
            cd provenance
            find portable installer -type f \
              \( -name 'Direct-Xfer.exe' -o -name 'Direct-Xfer.ServerHost.exe' -o -name "Direct-Xfer-Setup-${DX_VERSION}.exe" \) \
              -print0 | sort -z | xargs -0 sha256sum
            sha256sum source/security/sbom.cdx.json
            sha256sum "Direct-Xfer-${DX_VERSION}-source.zip"
          ) >> "$manifest"
          test "$(wc -l < "$manifest")" -eq 5
          cat "$manifest"

      - name: Upload provenance metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Direct-Xfer-${{ env.DX_VERSION }}-provenance-metadata
          path: |
            provenance/Direct-Xfer-${{ env.DX_VERSION }}-SHA256SUMS.txt
            provenance/Direct-Xfer-${{ env.DX_VERSION }}-source.zip
            provenance/source/security/sbom.cdx.json
          if-no-files-found: error

      - name: Generate GitHub build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            provenance/portable/**/Direct-Xfer.exe
            provenance/portable/**/Direct-Xfer.ServerHost.exe
            provenance/installer/**/Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe
            provenance/Direct-Xfer-${{ env.DX_VERSION }}-SHA256SUMS.txt
            provenance/Direct-Xfer-${{ env.DX_VERSION }}-source.zip

      - name: Generate GitHub SBOM attestation for source package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # The committed CycloneDX document describes the Direct-Xfer npm/source
          # package, not the .NET apphost executables individually. Bind it to the
          # exact source archive produced from this workflow commit.
          subject-path: provenance/Direct-Xfer-${{ env.DX_VERSION }}-source.zip
          sbom-path: provenance/source/security/sbom.cdx.json
