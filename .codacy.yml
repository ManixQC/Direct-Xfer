---
# Direct-Xfer Codacy configuration
#
# Keep security-capable analyzers active while removing known low-signal noise
# from deprecated, incompatible or operational-only quality linters.
#
# JSHint is deprecated by Codacy and produces thousands of false positives for
# this modern Node/CommonJS codebase (for example require/__dirname globals).
# ESLint/CodeQL/Opengrep-style security analyzers remain unaffected.
#
# TSQLLint targets Microsoft Transact-SQL, while Direct-Xfer SQL files are
# SQLite / Cloudflare D1 schemas and migrations. Excluding SQL only from
# TSQLLint avoids invalid SET/foreign-key diagnostics without hiding the files
# from other analyzers.

engines:
  jshint:
    exclude_paths:
      - "**/*.js"

  tsqllint:
    exclude_paths:
      - "oauth-broker/cloudflare-worker/migrations/**"
      - "lib/assets/*.sql"
      - "**/*.sql"

  # SignPath documentation intentionally contains literal public URLs required
  # for release/signing instructions. Those URL-style notes do not represent
  # code-quality or security defects.
  remark-lint:
    exclude_paths:
      - "signpath/**"
      - "CODE_SIGNING_POLICY.md"

  # These are interactive/operator PowerShell helpers. PSScriptAnalyzer mainly
  # reports Write-Host/ShouldProcess presentation notes here, while security
  # analyzers still inspect the files normally.
  psscriptanalyzer:
    exclude_paths:
      - ".github/scripts/prune-windows-node-modules.ps1"
      - "oauth-broker/cloudflare-worker/scripts/deploy.ps1"

  duplication:
    exclude_paths:
      - "test/**"
      - "test-historical/**"

  metric:
    exclude_paths:
      - "test/**"
      - "test-historical/**"

# Globally ignore only generated, vendored, dependency, or historical material.
# Runtime/application source (lib, public, pwa, oauth-broker, Windows sources,
# Dockerfiles and workflows) stays in scope for security and quality analysis.
exclude_paths:
  - "node_modules/**"
  - "third_party/**"
  - "test-historical/**"
  - "coverage/**"
  - "dist/**"
  - "build/**"
  - "releases/**"
  - "**/*.min.js"
  - "**/*.min.css"

  # The legacy Codacy SARIF formatter calls Files.readAllLines() for referenced
  # paths and crashes on binary assets. Keep non-source binaries out of that
  # formatter; security scanners for containers/dependencies run separately.
  - "**/*.png"
  - "**/*.ico"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.webp"
  - "**/*.bmp"
  - "**/*.avif"
  - "**/*.woff"
  - "**/*.woff2"
  - "**/*.ttf"
  - "**/*.eot"
  - "**/*.zip"
  - "**/*.gz"
  - "**/*.tgz"
  - "**/*.tar"
  - "**/*.7z"
  - "**/*.rar"
  - "**/*.pdf"
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.pdb"
  - "**/*.node"
  - "**/*.wasm"
  - "**/*.bin"
