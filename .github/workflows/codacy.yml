# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '36 12 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # GitHub code scanning accepts at most 5,000 displayed results per SARIF run
      # (25,000 hard maximum) and at most 20 runs per SARIF file. Codacy may emit
      # several tools in one file and noisy tools such as JSHint may exceed 5,000
      # results. Split oversized runs into deterministic 5,000-result chunks and
      # assign every derived run a unique automationDetails.id/category.
      - name: Normalize Codacy SARIF for GitHub limits
        shell: bash
        run: |
          set -euo pipefail
          test -s results.sarif
          jq -e '.version and (.runs | type == "array") and (.runs | length > 0)' results.sarif >/dev/null

          jq '
            def slug:
              ascii_downcase
              | gsub("[^a-z0-9._-]+"; "-")
              | gsub("^-+|-+$"; "");

            .runs |= (
              to_entries
              | map(
                  . as $entry
                  | ($entry.value.results // []) as $results
                  | (($results | length) as $result_count
                    | ([1, (($result_count + 4999) / 5000 | floor)] | max) as $chunk_count
                    | [range(0; $chunk_count)]
                    | map(
                        . as $chunk
                        | $entry.value
                        | .results = $results[($chunk * 5000):((($chunk + 1) * 5000))]
                        | .automationDetails = ((.automationDetails // {}) + {
                            id: (
                              "codacy/"
                              + ((.tool.driver.name // "tool") | slug)
                              + "-"
                              + ($entry.key | tostring)
                              + (if $chunk_count > 1 then "-part-" + (($chunk + 1) | tostring) else "" end)
                              + "/"
                            )
                          })
                      )
                  )
                )
              | add
            )
          ' results.sarif > results.normalized.sarif
          mv results.normalized.sarif results.sarif

          run_count="$(jq '.runs | length' results.sarif)"
          if [ "$run_count" -gt 20 ]; then
            echo "::error::Normalized Codacy SARIF contains $run_count runs; GitHub accepts at most 20 runs per SARIF file."
            exit 1
          fi

          max_results="$(jq '[.runs[].results | length] | max // 0' results.sarif)"
          if [ "$max_results" -gt 5000 ]; then
            echo "::error::A normalized Codacy SARIF run still contains $max_results results (limit 5000)."
            exit 1
          fi

          unique_count="$(jq '[.runs[].automationDetails.id] | unique | length' results.sarif)"
          if [ "$run_count" -ne "$unique_count" ]; then
            echo "::error::Codacy SARIF categories are not unique after normalization."
            exit 1
          fi

          echo "Normalized Codacy SARIF runs: $run_count"
          jq -r '.runs[] | "\(.automationDetails.id) results=\(.results | length)"' results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
