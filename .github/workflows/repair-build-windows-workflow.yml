name: Repair Windows workflow

on:
  push:
    paths:
      - '.github/workflows/repair-build-windows-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove merge-conflict markers from Windows workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/build-windows-csharp.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          output = []
          conflicts = 0
          i = 0

          while i < len(lines):
              if lines[i].startswith('<<<<<<< '):
                  conflicts += 1
                  i += 1
                  while i < len(lines) and not lines[i].startswith('======='):
                      i += 1
                  if i >= len(lines):
                      raise SystemExit('Malformed merge conflict: missing separator')
                  i += 1
                  chosen = []
                  while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                      chosen.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise SystemExit('Malformed merge conflict: missing end marker')
                  output.extend(chosen)
                  i += 1
                  continue
              output.append(lines[i])
              i += 1

          if conflicts != 4:
              raise SystemExit(f'Expected 4 merge conflicts, found {conflicts}')

          repaired = ''.join(output)
          for marker in ('<<<<<<<', '=======', '>>>>>>>'):
              if marker in repaired:
                  raise SystemExit(f'Unresolved merge marker remains: {marker}')

          if "run-name: v1.71.4" not in repaired or "DX_VERSION: '1.71.4'" not in repaired:
              raise SystemExit('The repaired workflow does not identify release 1.71.4')

          path.write_text(repaired, encoding='utf-8', newline='\n')
      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-windows-csharp.yml
          git diff --cached --check
          git commit -m 'Fix Windows workflow merge conflict'
          git push origin HEAD:main
