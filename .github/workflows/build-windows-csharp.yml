name: Build Direct-Xfer Windows C# + Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-launcher/**'
      - 'installer/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'lib/**'
      - 'public/**'
      - 'pwa/**'
      - 'test/**'
      - '.github/workflows/build-windows-csharp.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-2025

    env:
      DX_VERSION: '1.59.1'
      DX_RUNTIME_BUILD: '1.59.1-launcher27-csharp'
      DX_NODE_VERSION: '24.19.0'
      DX_NODE_EXE_SHA256: '3602f2bb1a10f2cbab4c36886218a33c1ab3db87290e73b033c46c77147d0237'
      INNO_VERSION: '6.7.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup Node.js for build
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install production dependencies
        shell: pwsh
        run: npm ci --omit=dev --ignore-scripts

      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Test release-critical changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $criticalTests = @(
            'test/release-1.58.0-regressions.test.js',
            'test/release-1.58.1-picker-scroll.test.js',
            'test/release-1.58.2-firefox-picker.test.js',
            'test/release-1.58.3-picker-ten-rows.test.js',
            'test/windows-antivirus-packaging-1.58.4.test.js',
            'test/windows-csharp-github-package-readme-1.58.4.test.js',
            'test/windows-csharp-runtime-layout-1.58.4.test.js',
            'test/windows-inno-installer-1.58.4.test.js',
            'test/windows-password-copy-history-tooltip-1.58.4.test.js',
            'test/recent-changes-ultra-audit-1.59.1.test.js',
            'test/windows-launcher-hardening-1.59.1.test.js'
          )

          $missingTests = @($criticalTests | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingTests.Count -gt 0) {
            $formatted = ($missingTests | ForEach-Object { " - $_" }) -join [Environment]::NewLine
            throw "Release-critical test files are missing from the Git checkout:$([Environment]::NewLine)$formatted"
          }

          & node --test @criticalTests
          if ($LASTEXITCODE -ne 0) {
            throw "Release-critical test suite failed with exit code $LASTEXITCODE"
          }

      - name: Build C# launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild windows-launcher\DirectXfer.Launcher.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

          $exe = 'windows-launcher\bin\Release\Direct-Xfer.exe'
          $config = 'windows-launcher\bin\Release\Direct-Xfer.exe.config'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "MSBuild completed without producing $exe"
          }
          if (-not (Test-Path -LiteralPath $config)) {
            throw "MSBuild completed without producing $config"
          }

      - name: Azure login for Artifact Signing
        if: ${{ vars.DX_ARTIFACT_SIGNING_ENABLED == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign C# launcher with Azure Artifact Signing
        if: ${{ vars.DX_ARTIFACT_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\windows-launcher\bin\Release\Direct-Xfer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Direct-Xfer Windows Launcher

      - name: Verify launcher signature when signing is enabled
        if: ${{ vars.DX_ARTIFACT_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'windows-launcher\bin\Release\Direct-Xfer.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid') {
            throw "Signed launcher Authenticode status is $($signature.Status)"
          }
          Write-Host "Launcher signed by: $($signature.SignerCertificate.Subject)"

      - name: Note unsigned build
        if: ${{ vars.DX_ARTIFACT_SIGNING_ENABLED != 'true' }}
        shell: pwsh
        run: Write-Host 'Azure Artifact Signing is not enabled; the build will remain unsigned.'

      - name: Create portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $PWD 'dist'
          $dist = Join-Path $distRoot "Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $app = Join-Path $dist 'runtime\app'
          $node = Join-Path $dist 'runtime\node'

          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $app, $node | Out-Null

          Copy-Item 'windows-launcher\bin\Release\Direct-Xfer.exe' -Destination $dist -Force
          Copy-Item 'windows-launcher\bin\Release\Direct-Xfer.exe.config' -Destination $dist -Force

          $portableReadme = 'windows-launcher\README-WINDOWS-PORTABLE.md'
          $rootReadme = 'README.md'
          $destReadme = Join-Path $dist 'README-WINDOWS-PORTABLE.md'
          if (Test-Path $portableReadme) {
            Copy-Item $portableReadme -Destination $destReadme -Force
          } elseif (Test-Path $rootReadme) {
            Copy-Item $rootReadme -Destination $destReadme -Force
          } else {
            Set-Content -Encoding UTF8 -Path $destReadme -Value @(
              "Direct-Xfer $env:DX_VERSION - Windows C#",
              '',
              'Direct-Xfer.exe is a C# / WinForms launcher targeting .NET Framework 4.8.',
              'The application runtime is located in runtime\app.',
              'The pinned Node.js runtime is located in runtime\node.'
            )
          }

          Copy-Item -Path @('package.json','package-lock.json','server.js') -Destination $app -Force
          Copy-Item -Path @('lib','public','pwa','node_modules') -Destination $app -Recurse -Force
          Set-Content -Encoding ASCII -NoNewline -Path (Join-Path $app '.dx-runtime-build') -Value $env:DX_RUNTIME_BUILD

          # Bundle an official pinned Node.js executable so the installed application
          # does not need to download or install an executable on first launch.
          $nodeExe = Join-Path $node 'node.exe'
          $nodeUrl = "https://nodejs.org/download/release/v$env:DX_NODE_VERSION/win-x64/node.exe"
          Write-Host "Downloading pinned Node.js runtime: $nodeUrl"
          Invoke-WebRequest -Uri $nodeUrl -OutFile $nodeExe -UseBasicParsing
          $nodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nodeExe).Hash.ToLowerInvariant()
          if ($nodeHash -ne $env:DX_NODE_EXE_SHA256) {
            throw "Node.js SHA-256 mismatch. Expected $env:DX_NODE_EXE_SHA256, got $nodeHash"
          }
          Set-Content -Encoding UTF8 -Path (Join-Path $node 'README.txt') -Value @(
            "Direct-Xfer pinned Node.js runtime $env:DX_NODE_VERSION (x64)",
            "SHA-256: $nodeHash",
            'Source: official nodejs.org release distribution.'
          )

          $required = @(
            (Join-Path $dist 'Direct-Xfer.exe'),
            (Join-Path $dist 'Direct-Xfer.exe.config'),
            (Join-Path $app '.dx-runtime-build'),
            (Join-Path $app 'package.json'),
            (Join-Path $app 'package-lock.json'),
            (Join-Path $app 'server.js'),
            (Join-Path $app 'public\app.js'),
            (Join-Path $app 'pwa\app.js'),
            (Join-Path $app 'node_modules\express\package.json'),
            $nodeExe
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Portable package is incomplete: missing $item"
            }
          }

          $marker = (Get-Content -Raw -LiteralPath (Join-Path $app '.dx-runtime-build')).Trim()
          if ($marker -ne $env:DX_RUNTIME_BUILD) {
            throw "Portable runtime marker mismatch: $marker"
          }

          $hashLines = @(
            "Direct-Xfer.exe  $((Get-FileHash -Algorithm SHA256 (Join-Path $dist 'Direct-Xfer.exe')).Hash.ToLowerInvariant())",
            "runtime/app/server.js  $((Get-FileHash -Algorithm SHA256 (Join-Path $app 'server.js')).Hash.ToLowerInvariant())",
            "runtime/node/node.exe  $nodeHash"
          )
          Set-Content -Encoding ASCII -Path (Join-Path $dist 'SHA256SUMS.txt') -Value $hashLines

          Write-Host "Portable runtime validated: $dist"

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_VERSION.exe"

          Write-Host "Downloading official Inno Setup $env:INNO_VERSION"
          Invoke-WebRequest -Uri $innoUrl -OutFile $innoInstaller -UseBasicParsing

          $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
          if ($signature.Status -ne 'Valid') {
            throw "Inno Setup Authenticode signature is not valid: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signer: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Verified Inno Setup signer: $($signature.SignerCertificate.Subject)"

          New-Item -ItemType Directory -Force -Path $innoDir | Out-Null
          $process = Start-Process -FilePath $innoInstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$innoDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with code $($process.ExitCode)"
          }

          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not installed at the expected path: $iscc"
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $installerDir = Join-Path $PWD 'dist\installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

          # Pass dynamic values through environment variables. This is compatible
          # with Inno Setup 6.x and avoids relying on newer long --define options.
          $env:DX_INNO_APP_VERSION = $env:DX_VERSION
          $env:DX_INNO_SOURCE_DIR = $dist
          $env:DX_INNO_OUTPUT_DIR = $installerDir

          & $env:INNO_ISCC 'installer\Direct-Xfer.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

          $setupExe = Join-Path $installerDir "Direct-Xfer-Setup-$env:DX_VERSION.exe"
          if (-not (Test-Path -LiteralPath $setupExe)) {
            throw "Inno Setup completed without producing $setupExe"
          }

          Write-Host "Generated installer: $setupExe"

      - name: Sign Windows installer with Azure Artifact Signing
        if: ${{ vars.DX_ARTIFACT_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\installer\Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Direct-Xfer Windows Installer

      - name: Finalize installer metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = Join-Path $PWD 'dist\installer'
          $setupExe = Join-Path $installerDir "Direct-Xfer-Setup-$env:DX_VERSION.exe"
          if (-not (Test-Path -LiteralPath $setupExe)) {
            throw "Installer is missing before finalization: $setupExe"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupExe).Hash.ToLowerInvariant()
          Set-Content -Encoding ASCII -NoNewline -Path (Join-Path $installerDir "Direct-Xfer-Setup-$env:DX_VERSION.exe.sha256") -Value "$setupHash  Direct-Xfer-Setup-$env:DX_VERSION.exe"
          $setupSignature = Get-AuthenticodeSignature -FilePath $setupExe
          if ('${{ vars.DX_ARTIFACT_SIGNING_ENABLED }}' -eq 'true' -and $setupSignature.Status -ne 'Valid') {
            throw "Signed installer Authenticode status is $($setupSignature.Status)"
          }
          Write-Host "SHA-256: $setupHash"
          Write-Host "Installer Authenticode status: $($setupSignature.Status)"
          if ($setupSignature.SignerCertificate) { Write-Host "Installer signed by: $($setupSignature.SignerCertificate.Subject)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Direct-Xfer-Setup-${{ env.DX_VERSION }}
          path: |
            dist/installer/Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe
            dist/installer/Direct-Xfer-Setup-${{ env.DX_VERSION }}.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v6
        with:
          name: Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp
          path: dist/Direct-Xfer-${{ env.DX_VERSION }}-Windows-CSharp/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
