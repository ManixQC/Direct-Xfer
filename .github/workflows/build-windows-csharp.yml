name: Build Direct-Xfer Windows C# + Installer
run-name: v1.66.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-launcher/**'
      - 'windows-server-host/**'
      - 'installer/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'lib/**'
      - 'public/**'
      - 'pwa/**'
      - 'scripts/**'
      - 'security/**'
      - 'test/**'
      - '.github/workflows/build-windows-csharp.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    env:
      DX_VERSION: '1.66.3'
      DX_RUNTIME_BUILD: '1.66.3-launcher76-csharp'
      DX_SERVER_HOST_BUILD: '1.66.3-serverhost50-csharp'
      DX_DOTNET_DESKTOP_RUNTIME_VERSION: '10.0.11'
      DX_DOTNET_RUNTIME_ZIP_SHA512: 'd9ab9c0d9916b8fa3585b5f403057f594ffffb8364dac09e0007dd8ac671c86754935b980d8fb5da83cb1b82ac3cd57cc407c969e6d837aaa2fae21047cb7448'
      DX_DOTNET_DESKTOP_RUNTIME_ZIP_SHA512: '1d32a9bf6c93f50dee5734048f825998b98266d0e28846dbee0310e2aad7e28fc2251e38ffad6a474a1e57381895130f2b3e1e1a4f875ac7f79271d91c6eb433'
      DX_NODE_VERSION: '24.19.0'
      DX_NODE_EXE_SHA256: '3602f2bb1a10f2cbab4c36886218a33c1ab3db87290e73b033c46c77147d0237'
      DX_RCLONE_VERSION: '1.74.4'
      DX_RCLONE_ZIP_SHA256: 'ef097ef9de37a57feb7d9f9c7afb34148ad3c65be8025f1d8f7f521554a701ea'
      DX_TESSERACT_VERSION: '5.5.3'
      DX_TESSERACT_PACKAGE_VERSION: '5.5.3.20260724'
      DX_TESSERACT_SETUP_SHA256: 'bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4'
      DX_TESSDATA_FAST_COMMIT: '87416418657359cb625c412a48b6e1d6d41c29bd'
      INNO_VERSION: '6.7.3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          architecture: x64
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high
      - name: Remove obsolete .NET Framework config files
        shell: pwsh
        run: |
          Remove-Item 'windows-launcher\App.config','windows-server-host\App.config' -Force -ErrorAction SilentlyContinue
      - name: Validate source and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.js -File | Where-Object { $_.FullName -notmatch '\\node_modules\\' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failure: $($_.FullName)" }
          }
          $tests = @(Get-ChildItem test -Filter '*.test.js' -File | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No Direct-Xfer tests found.' }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw "Direct-Xfer tests failed with exit code $LASTEXITCODE" }
      - name: Publish C# applications on .NET 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $PWD 'build\windows-dotnet10'
          $hostOut = Join-Path $buildRoot 'server-host'
          $launcherOut = Join-Path $buildRoot 'launcher'
          Remove-Item $buildRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $hostOut,$launcherOut | Out-Null
          dotnet publish windows-server-host\DirectXfer.ServerHost.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:AppHostDotNetSearch=AppRelative -p:AppHostRelativeDotNet=runtime\dotnet -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false -p:DebugType=None -o $hostOut
          if ($LASTEXITCODE -ne 0) { throw "ServerHost .NET 10 publish failed: $LASTEXITCODE" }
          dotnet publish windows-launcher\DirectXfer.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:AppHostDotNetSearch=AppRelative -p:AppHostRelativeDotNet=runtime\dotnet -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false -p:DebugType=None -o $launcherOut
          if ($LASTEXITCODE -ne 0) { throw "Launcher .NET 10 publish failed: $LASTEXITCODE" }

          # Framework-dependent single-file apphosts keep app dependencies bundled while using one private shared runtime.
          foreach ($entry in @(
            @{ Name = 'ServerHost'; Dir = $hostOut; Exe = 'Direct-Xfer.ServerHost.exe' },
            @{ Name = 'Launcher'; Dir = $launcherOut; Exe = 'Direct-Xfer.exe' }
          )) {
            $files = @(Get-ChildItem -LiteralPath $entry.Dir -Recurse -File)
            if ($files.Count -ne 1 -or $files[0].Name -ne $entry.Exe) {
              throw "$($entry.Name) publish is not single-file: $($files.Name -join ', ')"
            }
          }
      - name: Verify executables are unsigned by design
        shell: pwsh
        run: |
          foreach ($exe in @('build\windows-dotnet10\launcher\Direct-Xfer.exe','build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe')) {
            if (-not (Test-Path $exe)) { throw "Missing $exe" }
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'NotSigned') { throw "$exe must remain unsigned by design; status=$($sig.Status)" }
          }
      - name: Create portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-DxDownload([string]$Uri, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing -TimeoutSec 180
                if (-not (Test-Path -LiteralPath $OutFile -PathType Leaf) -or (Get-Item -LiteralPath $OutFile).Length -le 0) {
                  throw "Downloaded file is missing or empty: $OutFile"
                }
                return
              } catch {
                if ($attempt -ge 3) { throw }
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }
          $distRoot = Join-Path $PWD 'dist'
          $dist = Join-Path $distRoot "Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $app = Join-Path $dist 'runtime\app'
          $node = Join-Path $dist 'runtime\node'
          $dotnetRuntime = Join-Path $dist 'runtime\dotnet'
          $rclone = Join-Path $dist 'runtime\rclone'
          $tesseract = Join-Path $dist 'runtime\tesseract'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $app,$node,$dotnetRuntime,$rclone,$tesseract | Out-Null
          Copy-Item 'build\windows-dotnet10\launcher\Direct-Xfer.exe' $dist
          Copy-Item 'build\windows-dotnet10\server-host\Direct-Xfer.ServerHost.exe' $dist
          Copy-Item 'windows-launcher\README-WINDOWS-PORTABLE.md' (Join-Path $dist 'README-WINDOWS-PORTABLE.md')
          Copy-Item @('package.json','package-lock.json','server.js') $app
          Copy-Item @('lib','public','pwa','scripts','security','node_modules') $app -Recurse
          $marker = Join-Path $app 'runtime-build.txt'
          # Use File.WriteAllText instead of positional Set-Content binding. This is deterministic
          # on Windows PowerShell/PowerShell 7 and guarantees that the marker is materialized
          # before the portable package is validated or passed to Inno Setup.
          [System.IO.File]::WriteAllText($marker, [string]$env:DX_RUNTIME_BUILD, [System.Text.Encoding]::ASCII)
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Failed to create runtime marker: $marker" }
          $markerNow = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($markerNow -ne $env:DX_RUNTIME_BUILD) { throw "Runtime marker write mismatch: '$markerNow' != '$env:DX_RUNTIME_BUILD'" }
          $nodeExe = Join-Path $node 'node.exe'
          $nodeUrl = "https://nodejs.org/download/release/v$env:DX_NODE_VERSION/win-x64/node.exe"
          Invoke-DxDownload $nodeUrl $nodeExe
          $nodeHash = (Get-FileHash -Algorithm SHA256 $nodeExe).Hash.ToLowerInvariant()
          if ($nodeHash -ne $env:DX_NODE_EXE_SHA256) { throw "Node SHA-256 mismatch: $nodeHash" }
          Set-Content -Encoding UTF8 (Join-Path $node 'README.txt') @("Direct-Xfer pinned Node.js $env:DX_NODE_VERSION x64","SHA-256: $nodeHash","Source: nodejs.org")


          # Build one private .NET 10 runtime tree shared by both framework-dependent
          # single-file apphosts. Microsoft's WindowsDesktop ZIP is an additive framework
          # archive: it does not provide dotnet.exe/hostfxr/Microsoft.NETCore.App by itself.
          # Merge the pinned base .NET Runtime ZIP first, then the matching WindowsDesktop
          # Runtime ZIP into the same runtime\dotnet directory. This keeps one shared tree
          # without duplicating the runtime inside both Direct-Xfer executables.
          $dotnetBaseRuntimeZip = Join-Path $env:RUNNER_TEMP "dotnet-runtime-$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION-win-x64.zip"
          $dotnetBaseRuntimeUrl = "https://builds.dotnet.microsoft.com/dotnet/Runtime/$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION/dotnet-runtime-$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION-win-x64.zip"
          Invoke-DxDownload $dotnetBaseRuntimeUrl $dotnetBaseRuntimeZip
          $dotnetBaseRuntimeHash = (Get-FileHash -Algorithm SHA512 $dotnetBaseRuntimeZip).Hash.ToLowerInvariant()
          if ($dotnetBaseRuntimeHash -ne $env:DX_DOTNET_RUNTIME_ZIP_SHA512) { throw "Private .NET Runtime SHA-512 mismatch: $dotnetBaseRuntimeHash" }
          Expand-Archive -LiteralPath $dotnetBaseRuntimeZip -DestinationPath $dotnetRuntime -Force

          $dotnetDesktopRuntimeZip = Join-Path $env:RUNNER_TEMP "windowsdesktop-runtime-$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION-win-x64.zip"
          $dotnetDesktopRuntimeUrl = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION/windowsdesktop-runtime-$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION-win-x64.zip"
          Invoke-DxDownload $dotnetDesktopRuntimeUrl $dotnetDesktopRuntimeZip
          $dotnetDesktopRuntimeHash = (Get-FileHash -Algorithm SHA512 $dotnetDesktopRuntimeZip).Hash.ToLowerInvariant()
          if ($dotnetDesktopRuntimeHash -ne $env:DX_DOTNET_DESKTOP_RUNTIME_ZIP_SHA512) { throw "Private .NET WindowsDesktop Runtime SHA-512 mismatch: $dotnetDesktopRuntimeHash" }
          Expand-Archive -LiteralPath $dotnetDesktopRuntimeZip -DestinationPath $dotnetRuntime -Force

          $privateDotnetExe = Join-Path $dotnetRuntime 'dotnet.exe'
          $privateCore = Join-Path $dotnetRuntime "shared\Microsoft.NETCore.App\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION"
          $privateDesktop = Join-Path $dotnetRuntime "shared\Microsoft.WindowsDesktop.App\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION"
          $privateHostFxr = Join-Path $dotnetRuntime "host\fxr\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION\hostfxr.dll"
          foreach ($required in @($privateDotnetExe,$privateCore,$privateDesktop,$privateHostFxr)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Incomplete private .NET runtime: missing $required" }
          }
          $privateRuntimeOutput = @(& $privateDotnetExe --list-runtimes 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Private dotnet runtime probe failed: $LASTEXITCODE" }
          $privateRuntimeLines = @($privateRuntimeOutput | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          $escapedDotnetVersion = [regex]::Escape($env:DX_DOTNET_DESKTOP_RUNTIME_VERSION)
          if (-not ($privateRuntimeLines | Where-Object { $_ -match "^Microsoft\.NETCore\.App\s+$escapedDotnetVersion\s+\[" })) { throw "Private runtime is missing Microsoft.NETCore.App $env:DX_DOTNET_DESKTOP_RUNTIME_VERSION" }
          if (-not ($privateRuntimeLines | Where-Object { $_ -match "^Microsoft\.WindowsDesktop\.App\s+$escapedDotnetVersion\s+\[" })) { throw "Private runtime is missing Microsoft.WindowsDesktop.App $env:DX_DOTNET_DESKTOP_RUNTIME_VERSION" }
          [System.IO.File]::WriteAllLines((Join-Path $dotnetRuntime 'DIRECT-XFER-README.txt'), @(
            "Direct-Xfer private shared .NET 10 runtime tree $env:DX_DOTNET_DESKTOP_RUNTIME_VERSION x64",
            "Base Runtime SHA-512: $dotnetBaseRuntimeHash",
            "Base Runtime source: $dotnetBaseRuntimeUrl",
            "WindowsDesktop Runtime SHA-512: $dotnetDesktopRuntimeHash",
            "WindowsDesktop Runtime source: $dotnetDesktopRuntimeUrl",
            "The two official Microsoft archives are merged into this single runtime tree.",
            "Used by both Direct-Xfer.exe and Direct-Xfer.ServerHost.exe via AppHostDotNetSearch=AppRelative"
          ), [System.Text.Encoding]::UTF8)

          # Bundle the official pinned rclone Windows AMD64 executable. The archive checksum
          # is taken from rclone's signed SHA256SUMS release file so CI never trusts an
          # unverified moving/latest download.
          $rcloneZip = Join-Path $env:RUNNER_TEMP "rclone-v$env:DX_RCLONE_VERSION-windows-amd64.zip"
          $rcloneExtract = Join-Path $env:RUNNER_TEMP "rclone-v$env:DX_RCLONE_VERSION-windows-amd64"
          Remove-Item $rcloneZip -Force -ErrorAction SilentlyContinue
          Remove-Item $rcloneExtract -Recurse -Force -ErrorAction SilentlyContinue
          $rcloneUrl = "https://downloads.rclone.org/v$env:DX_RCLONE_VERSION/rclone-v$env:DX_RCLONE_VERSION-windows-amd64.zip"
          Invoke-DxDownload $rcloneUrl $rcloneZip
          $rcloneZipHash = (Get-FileHash -Algorithm SHA256 $rcloneZip).Hash.ToLowerInvariant()
          if ($rcloneZipHash -ne $env:DX_RCLONE_ZIP_SHA256) { throw "rclone ZIP SHA-256 mismatch: $rcloneZipHash" }
          Expand-Archive -LiteralPath $rcloneZip -DestinationPath $rcloneExtract -Force
          $rcloneSource = @(Get-ChildItem -LiteralPath $rcloneExtract -Recurse -Filter 'rclone.exe' -File)
          if ($rcloneSource.Count -ne 1) { throw "Expected exactly one rclone.exe in the official archive; found $($rcloneSource.Count)" }
          $rcloneExe = Join-Path $rclone 'rclone.exe'
          Copy-Item -LiteralPath $rcloneSource[0].FullName -Destination $rcloneExe -Force
          $rcloneVersionOutput = @(& $rcloneExe version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Bundled rclone failed its version probe: $LASTEXITCODE" }
          $rcloneVersionText = (($rcloneVersionOutput | ForEach-Object { [string]$_ }) -join "`n")
          $rcloneVersionMatch = [regex]::Match($rcloneVersionText, '(?im)^\s*rclone\s+v(?<base>\d+\.\d+\.\d+)\s*$')
          if (-not $rcloneVersionMatch.Success -or $rcloneVersionMatch.Groups['base'].Value -ne $env:DX_RCLONE_VERSION) { throw "Unexpected bundled rclone version: $($rcloneVersionOutput -join ' | ')" }
          [System.IO.File]::WriteAllLines((Join-Path $rclone 'README.txt'), @(
            "Direct-Xfer bundled rclone v$env:DX_RCLONE_VERSION Windows AMD64",
            "Archive SHA-256: $rcloneZipHash",
            "Source: $rcloneUrl",
            "Configuration: %LOCALAPPDATA%\Direct-Xfer\data\rclone\rclone.conf"
          ), [System.Text.Encoding]::UTF8)

          # Bundle Tesseract OCR for the Windows runtime. Tesseract 5.5.3 is pinned
          # by release asset + SHA-256. Language models are pinned to an immutable
          # tessdata_fast commit so OCR remains reproducible across future builds.
          $tesseractSetup = Join-Path $env:RUNNER_TEMP "tesseract-ocr-w64-setup-$env:DX_TESSERACT_PACKAGE_VERSION.exe"
          $tesseractStage = Join-Path $env:RUNNER_TEMP 'direct-xfer-tesseract-portable'
          Remove-Item $tesseractSetup -Force -ErrorAction SilentlyContinue
          Remove-Item $tesseractStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tesseractStage | Out-Null
          $tesseractUrl = "https://github.com/tesseract-ocr/tesseract/releases/download/$env:DX_TESSERACT_VERSION/tesseract-ocr-w64-setup-$env:DX_TESSERACT_PACKAGE_VERSION.exe"
          Invoke-DxDownload $tesseractUrl $tesseractSetup
          $tesseractSetupHash = (Get-FileHash -Algorithm SHA256 $tesseractSetup).Hash.ToLowerInvariant()
          if ($tesseractSetupHash -ne $env:DX_TESSERACT_SETUP_SHA256) { throw "Tesseract setup SHA-256 mismatch: $tesseractSetupHash" }
          $tessInstall = Start-Process -FilePath $tesseractSetup -ArgumentList @('/S', "/D=$tesseractStage") -PassThru
          if (-not $tessInstall.WaitForExit(120000)) {
            try { Stop-Process -Id $tessInstall.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw 'Tesseract silent extraction/install timed out after 120 seconds.'
          }
          if ($tessInstall.ExitCode -ne 0) { throw "Tesseract silent extraction/install failed: $($tessInstall.ExitCode)" }
          $tesseractStageExe = Join-Path $tesseractStage 'tesseract.exe'
          if (-not (Test-Path -LiteralPath $tesseractStageExe -PathType Leaf)) { throw "Tesseract installer did not create tesseract.exe in $tesseractStage" }
          Copy-Item -Path (Join-Path $tesseractStage '*') -Destination $tesseract -Recurse -Force
          $tesseractExe = Join-Path $tesseract 'tesseract.exe'
          $tessdataDir = Join-Path $tesseract 'tessdata'
          New-Item -ItemType Directory -Force -Path $tessdataDir | Out-Null
          foreach ($lang in @('eng','fra','spa')) {
            $langUrl = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$env:DX_TESSDATA_FAST_COMMIT/$lang.traineddata"
            $langPath = Join-Path $tessdataDir "$lang.traineddata"
            Invoke-DxDownload $langUrl $langPath
            if (-not (Test-Path -LiteralPath $langPath -PathType Leaf) -or (Get-Item -LiteralPath $langPath).Length -lt 100000) { throw "Invalid Tesseract language model: $langPath" }
          }
          $previousTessdataPrefix = $env:TESSDATA_PREFIX
          try {
            $env:TESSDATA_PREFIX = $tessdataDir
            $tesseractVersionOutput = @(& $tesseractExe --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Bundled Tesseract failed its version probe: $LASTEXITCODE" }
            $tesseractVersionText = (($tesseractVersionOutput | ForEach-Object { [string]$_ }) -join "`n")
            $tesseractVersionMatch = [regex]::Match($tesseractVersionText, '(?im)^\s*tesseract\s+v?(?<base>\d+\.\d+\.\d+)(?:\.\d+)?(?:\s|$)')
            if (-not $tesseractVersionMatch.Success -or $tesseractVersionMatch.Groups['base'].Value -ne $env:DX_TESSERACT_VERSION) { throw "Unexpected bundled Tesseract version: $($tesseractVersionOutput -join ' | ')" }
            $tesseractLangOutput = @(& $tesseractExe --list-langs --tessdata-dir $tessdataDir 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Bundled Tesseract language probe failed: $LASTEXITCODE" }
            $tesseractLangLines = @($tesseractLangOutput | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            foreach ($lang in @('eng','fra','spa')) { if ($tesseractLangLines -notcontains $lang) { throw "Bundled Tesseract is missing language '$lang'" } }
          } finally {
            $env:TESSDATA_PREFIX = $previousTessdataPrefix
          }
          Remove-Item (Join-Path $tesseract 'uninstall.exe') -Force -ErrorAction SilentlyContinue
          [System.IO.File]::WriteAllLines((Join-Path $tesseract 'DIRECT-XFER-README.txt'), @(
            "Direct-Xfer bundled Tesseract $env:DX_TESSERACT_VERSION Windows x64",
            "Setup package: $env:DX_TESSERACT_PACKAGE_VERSION",
            "Setup SHA-256: $tesseractSetupHash",
            "Source: $tesseractUrl",
            "tessdata_fast commit: $env:DX_TESSDATA_FAST_COMMIT",
            "Bundled OCR languages: eng, fra, spa"
          ), [System.Text.Encoding]::UTF8)

          # Re-materialize the marker as the final operation of package assembly so later
          # validation cannot observe a partially prepared runtime tree.
          [System.IO.File]::WriteAllText($marker, [string]$env:DX_RUNTIME_BUILD, [System.Text.Encoding]::ASCII)
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Runtime marker disappeared during package assembly: $marker" }
      - name: Verify shared private .NET 10 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $privateDotnetRoot = Join-Path $dist 'runtime\dotnet'
          $privateDotnetExe = Join-Path $privateDotnetRoot 'dotnet.exe'
          if (-not (Test-Path -LiteralPath $privateDotnetExe -PathType Leaf)) { throw "Missing private .NET host: $privateDotnetExe" }
          $emptyDotnetRoot = Join-Path $env:RUNNER_TEMP 'dx-empty-global-dotnet-root'
          Remove-Item $emptyDotnetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $emptyDotnetRoot | Out-Null
          $previousDotnetRoot = $env:DOTNET_ROOT
          $previousDotnetRootX64 = $env:DOTNET_ROOT_X64
          $previousMultilevel = $env:DOTNET_MULTILEVEL_LOOKUP
          $previousHostTrace = $env:DOTNET_HOST_TRACE
          $previousHostTraceFile = $env:DOTNET_HOST_TRACEFILE
          $previousHostTraceVerbosity = $env:DOTNET_HOST_TRACE_VERBOSITY
          try {
            # AppHostDotNetSearch=AppRelative is intended to bind both EXEs to the private
            # runtime beside them. Do not rely only on a successful managed-code probe:
            # actions/setup-dotnet also places a machine/user runtime on the runner. .NET 10
            # host tracing lets CI prove that hostfxr was actually loaded from runtime\dotnet.
            $env:DOTNET_ROOT = $emptyDotnetRoot
            $env:DOTNET_ROOT_X64 = $emptyDotnetRoot
            $env:DOTNET_MULTILEVEL_LOOKUP = '0'
            $env:DOTNET_HOST_TRACE = '1'
            $env:DOTNET_HOST_TRACE_VERBOSITY = '4'
            $privateRootNormalized = ([System.IO.Path]::GetFullPath($privateDotnetRoot)).Replace('/', '\').TrimEnd('\').ToLowerInvariant()
            $expectedHostFxr = Join-Path $privateDotnetRoot "host\fxr\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION\hostfxr.dll"
            $expectedHostFxrNormalized = ([System.IO.Path]::GetFullPath($expectedHostFxr)).Replace('/', '\').ToLowerInvariant()
            foreach ($exeName in @('Direct-Xfer.exe','Direct-Xfer.ServerHost.exe')) {
              $exe = Join-Path $dist $exeName
              $safeName = [System.IO.Path]::GetFileNameWithoutExtension($exeName).Replace('.', '-')
              $traceFile = Join-Path $env:RUNNER_TEMP ("dx-dotnet-host-$safeName.log")
              Remove-Item -LiteralPath $traceFile -Force -ErrorAction SilentlyContinue
              $env:DOTNET_HOST_TRACEFILE = $traceFile
              $process = Start-Process -FilePath $exe -ArgumentList '--dx-runtime-probe' -WorkingDirectory $dist -PassThru
              if (-not $process.WaitForExit(15000)) {
                try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
                throw "$exeName timed out during the shared private .NET runtime probe."
              }
              if ($process.ExitCode -ne 0) { throw "$exeName failed the shared private .NET runtime probe: $($process.ExitCode)" }
              if (-not (Test-Path -LiteralPath $traceFile -PathType Leaf)) { throw "$exeName did not produce a .NET host trace." }
              $traceNormalized = (Get-Content -LiteralPath $traceFile -Raw).Replace('/', '\').ToLowerInvariant()
              if (-not $traceNormalized.Contains($privateRootNormalized)) {
                throw "$exeName reached managed code but its .NET host trace did not reference the packaged runtime root."
              }
              $resolvedHostFxrMarker = "resolved fxr [$expectedHostFxrNormalized]"
              $loadedHostFxrMarker = "loaded library from $expectedHostFxrNormalized"
              if (-not ($traceNormalized.Contains($resolvedHostFxrMarker) -or $traceNormalized.Contains($loadedHostFxrMarker))) {
                throw "$exeName did not resolve/load hostfxr from the pinned private .NET $env:DX_DOTNET_DESKTOP_RUNTIME_VERSION runtime."
              }
            }
          } finally {
            $env:DOTNET_ROOT = $previousDotnetRoot
            $env:DOTNET_ROOT_X64 = $previousDotnetRootX64
            $env:DOTNET_MULTILEVEL_LOOKUP = $previousMultilevel
            $env:DOTNET_HOST_TRACE = $previousHostTrace
            $env:DOTNET_HOST_TRACEFILE = $previousHostTraceFile
            $env:DOTNET_HOST_TRACE_VERBOSITY = $previousHostTraceVerbosity
          }
      - name: Verify portable runtime layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $app = Join-Path $dist 'runtime\app'
          $marker = Join-Path $app 'runtime-build.txt'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Missing runtime marker: $marker" }
          $markerValue = (Get-Content -LiteralPath $marker -Raw).Trim()
          if ($markerValue -ne $env:DX_RUNTIME_BUILD) { throw "Runtime marker mismatch: '$markerValue' != '$env:DX_RUNTIME_BUILD'" }
          foreach ($rel in @('package.json','server.js','public\app.js','node_modules\express\package.json')) {
            $file = Join-Path $app $rel
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing runtime file: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty runtime file: $file" }
          }
          $privateDotnetRoot = Join-Path $dist 'runtime\dotnet'
          $privateDotnetExe = Join-Path $privateDotnetRoot 'dotnet.exe'
          $privateCore = Join-Path $privateDotnetRoot "shared\Microsoft.NETCore.App\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION"
          $privateDesktop = Join-Path $privateDotnetRoot "shared\Microsoft.WindowsDesktop.App\$env:DX_DOTNET_DESKTOP_RUNTIME_VERSION"
          foreach ($required in @($privateDotnetExe,$privateCore,$privateDesktop)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing private shared .NET runtime component: $required" }
          }
          $privateRuntimeOutput = @(& $privateDotnetExe --list-runtimes 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Private .NET runtime layout probe failed: $LASTEXITCODE" }
          $privateRuntimeText = (($privateRuntimeOutput | ForEach-Object { [string]$_ }) -join "`n")
          $escapedDotnetVersion = [regex]::Escape($env:DX_DOTNET_DESKTOP_RUNTIME_VERSION)
          if ($privateRuntimeText -notmatch "(?m)^Microsoft\.NETCore\.App\s+$escapedDotnetVersion\s+\[") { throw 'Private runtime does not expose the pinned Microsoft.NETCore.App.' }
          if ($privateRuntimeText -notmatch "(?m)^Microsoft\.WindowsDesktop\.App\s+$escapedDotnetVersion\s+\[") { throw 'Private runtime does not expose the pinned Microsoft.WindowsDesktop.App.' }
          $rcloneExe = Join-Path $dist 'runtime\rclone\rclone.exe'
          if (-not (Test-Path -LiteralPath $rcloneExe -PathType Leaf)) { throw "Missing bundled rclone: $rcloneExe" }
          if ((Get-Item -LiteralPath $rcloneExe).Length -le 0) { throw "Empty bundled rclone: $rcloneExe" }
          $rcloneVersionOutput = @(& $rcloneExe version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Bundled rclone runtime validation failed: $LASTEXITCODE" }
          $rcloneVersionText = (($rcloneVersionOutput | ForEach-Object { [string]$_ }) -join "`n")
          $rcloneVersionMatch = [regex]::Match($rcloneVersionText, '(?im)^\s*rclone\s+v(?<base>\d+\.\d+\.\d+)\s*$')
          if (-not $rcloneVersionMatch.Success -or $rcloneVersionMatch.Groups['base'].Value -ne $env:DX_RCLONE_VERSION) { throw "Bundled rclone runtime version mismatch: $($rcloneVersionOutput -join ' | ')" }
          $tesseractRoot = Join-Path $dist 'runtime\tesseract'
          $tesseractExe = Join-Path $tesseractRoot 'tesseract.exe'
          $tessdataDir = Join-Path $tesseractRoot 'tessdata'
          if (-not (Test-Path -LiteralPath $tesseractExe -PathType Leaf)) { throw "Missing bundled Tesseract: $tesseractExe" }
          $previousTessdataPrefix = $env:TESSDATA_PREFIX
          try {
            $env:TESSDATA_PREFIX = $tessdataDir
            $tesseractVersionOutput = @(& $tesseractExe --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Bundled Tesseract runtime version probe failed: $LASTEXITCODE" }
            $tesseractVersionText = (($tesseractVersionOutput | ForEach-Object { [string]$_ }) -join "`n")
            $tesseractVersionMatch = [regex]::Match($tesseractVersionText, '(?im)^\s*tesseract\s+v?(?<base>\d+\.\d+\.\d+)(?:\.\d+)?(?:\s|$)')
            if (-not $tesseractVersionMatch.Success -or $tesseractVersionMatch.Groups['base'].Value -ne $env:DX_TESSERACT_VERSION) { throw "Bundled Tesseract runtime version mismatch: $($tesseractVersionOutput -join ' | ')" }
            $langs = @(& $tesseractExe --list-langs --tessdata-dir $tessdataDir 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Bundled Tesseract runtime language probe failed: $LASTEXITCODE" }
            $langLines = @($langs | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            foreach ($lang in @('eng','fra','spa')) {
              $model = Join-Path $tessdataDir "$lang.traineddata"
              if (-not (Test-Path -LiteralPath $model -PathType Leaf)) { throw "Missing bundled Tesseract model: $model" }
              if ($langLines -notcontains $lang) { throw "Bundled Tesseract runtime does not expose '$lang'" }
            }
          } finally {
            $env:TESSDATA_PREFIX = $previousTessdataPrefix
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_VERSION.exe"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile $installer -UseBasicParsing -TimeoutSec 180
              if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or (Get-Item -LiteralPath $installer).Length -le 0) { throw 'Inno Setup download is missing or empty.' }
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid') { throw "Invalid Inno Setup signature: $($sig.Status)" }
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $innoInstall = Start-Process $installer -ArgumentList '/VERYSILENT',('/DIR='+$dir),'/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $innoInstall.WaitForExit(120000)) {
            try { Stop-Process -Id $innoInstall.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw 'Inno Setup installation timed out after 120 seconds.'
          }
          if ($innoInstall.ExitCode -ne 0) { throw "Inno Setup installation failed: $($innoInstall.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Inno Setup compiler is missing after installation: $iscc" }
          "DX_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DX_INNO_APP_VERSION = $env:DX_VERSION
          $env:DX_INNO_DOTNET_RUNTIME_VERSION = $env:DX_DOTNET_DESKTOP_RUNTIME_VERSION
          $env:DX_INNO_SOURCE_DIR = Join-Path $PWD "dist\Direct-Xfer-$env:DX_VERSION-Windows-CSharp"
          $env:DX_INNO_OUTPUT_DIR = Join-Path $PWD 'dist\installer'
          & $env:DX_ISCC 'installer\Direct-Xfer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v6
        with:
          name: Direct-Xfer-1.66.3-Windows-CSharp
          path: dist/Direct-Xfer-1.66.3-Windows-CSharp/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: Direct-Xfer-Setup-1.66.3
          path: dist/installer/Direct-Xfer-Setup-1.66.3.exe
          if-no-files-found: error
