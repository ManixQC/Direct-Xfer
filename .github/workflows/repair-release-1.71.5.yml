name: Repair and bump Direct-Xfer 1.71.5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-release-1.71.5.yml'
      - '.github/workflows/build-windows-csharp.yml'

permissions:
  contents: write

jobs:
  repair-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair repository conflict artifacts
        shell: python
        run: |
          from pathlib import Path

          ROOT = Path('.')

          def resolve_theirs(text: str):
              lines = text.splitlines(keepends=True)
              out = []
              conflicts = 0
              i = 0
              while i < len(lines):
                  if lines[i].startswith('<<<<<<< '):
                      conflicts += 1
                      i += 1
                      while i < len(lines) and not lines[i].startswith('======='):
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError('Malformed conflict: missing =======')
                      i += 1
                      chosen = []
                      while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                          chosen.append(lines[i])
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError('Malformed conflict: missing >>>>>>>')
                      out.extend(chosen)
                      i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              return ''.join(out), conflicts

          repaired_files = []
          conflict_count = 0
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[:2] == ('.github', 'workflows'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '<<<<<<< ' not in text:
                  continue
              repaired, count = resolve_theirs(text)
              if not count:
                  continue
              path.write_text(repaired, encoding='utf-8', newline='\n')
              repaired_files.append(str(path))
              conflict_count += count

          leftovers = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[:2] == ('.github', 'workflows'):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              if any(line.startswith(('<<<<<<< ', '=======', '>>>>>>> ')) for line in lines):
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError('Unresolved merge markers: ' + ', '.join(leftovers))

          print(f'Resolved {conflict_count} conflict blocks in {len(repaired_files)} files')
          for name in repaired_files:
              print('  repaired:', name)

      - name: Validate repaired repository metadata
        shell: python
        run: |
          from pathlib import Path
          import json

          for rel in (
              'package.json',
              'package-lock.json',
              'oauth-broker/package.json',
              'oauth-broker/cloudflare-worker/package.json',
          ):
              json.loads(Path(rel).read_text(encoding='utf-8'))
              print('valid json:', rel)

      - name: Persist repository repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No conflict repair changes to commit.'
          else
            git commit -m 'repair: remove accidental merge conflict artifacts'
            git push origin HEAD:main
          fi

  prepare-and-test-release:
    needs: repair-repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure checkout contains persisted repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!.github/workflows' ':!node_modules' ; then
            echo 'Unresolved merge markers remain in persisted main.' >&2
            exit 1
          fi

      - name: Prepare 1.71.5 release metadata
        shell: python
        run: |
          from pathlib import Path
          import json

          NEW = '1.71.5'
          OLD_VERSIONS = ('1.71.4',)
          OLD_BUILD = 'pwa467'
          NEW_BUILD = 'pwa468'
          OLD_CACHE = 'v=448'
          NEW_CACHE = 'v=449'

          windows_workflow_path = Path('.github/workflows/build-windows-csharp.yml')
          windows_workflow = windows_workflow_path.read_text(encoding='utf-8')
          expected_windows_markers = (
              f'run-name: v{NEW}',
              f"DX_VERSION: '{NEW}'",
          )
          missing_windows_markers = [marker for marker in expected_windows_markers if marker not in windows_workflow]
          if missing_windows_markers:
              raise RuntimeError(
                  'Windows release workflow is not synchronized with ' + NEW + ': ' + ', '.join(missing_windows_markers)
              )

          for rel in ('package.json', 'oauth-broker/package.json', 'oauth-broker/cloudflare-worker/package.json'):
              path = Path(rel)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['version'] = NEW
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = NEW
          lock['packages']['']['version'] = NEW
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          targets = []
          targets += [p for p in Path('pwa').rglob('*') if p.is_file()]
          targets += [Path('public/index.html'), Path('installer/Direct-Xfer.iss')]
          targets += [p for p in Path('security').rglob('*') if p.is_file()]
          targets += [p for p in Path('test').rglob('*.js') if p.is_file()]
          targets += [p for p in Path('signpath').rglob('*') if p.is_file()]

          seen = set()
          for path in targets:
              if path in seen or not path.exists():
                  continue
              seen.add(path)
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old in OLD_VERSIONS:
                  updated = updated.replace(old, NEW)
                  escaped_old = old.replace('.', '\\.')
                  escaped_new = NEW.replace('.', '\\.')
                  updated = updated.replace(escaped_old, escaped_new)
              updated = updated.replace(OLD_BUILD, NEW_BUILD).replace(OLD_CACHE, NEW_CACHE)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          stale_assertions = []
          for path in Path('test').rglob('*.js'):
              text = path.read_text(encoding='utf-8')
              for old in OLD_VERSIONS:
                  escaped_old = old.replace('.', '\\.')
                  if escaped_old in text:
                      stale_assertions.append(f'{path}: {escaped_old}')
          if stale_assertions:
              raise RuntimeError('Stale escaped release assertions remain: ' + ', '.join(stale_assertions))

          for rel in ('package.json', 'package-lock.json', 'oauth-broker/package.json', 'oauth-broker/cloudflare-worker/package.json'):
              json.loads(Path(rel).read_text(encoding='utf-8'))

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate security inventories and Windows integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run security:inventory
          npm run security:static-audit
          node scripts/asvs-l3-partial-audit.js --write
          node scripts/sync-windows-runtime-manifest.js

      - name: Validate source and tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          npm test

      - name: Commit tested 1.71.5 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No 1.71.5 release changes to commit.'
            exit 1
          fi
          git commit -m 'v1.71.5 repair release metadata and validated outputs'
          git push origin HEAD:main
