# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '36 12 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Codacy's legacy SARIF formatter assumes any referenced source file is UTF-8.
      # Fail early with the exact path instead of an opaque Java MalformedInputException.
      - name: Validate Codacy text inputs are UTF-8
        shell: bash
        run: node scripts/check-codacy-input-utf8.js

      # This GitHub Security workflow intentionally runs only ESLint 9. Running
      # Codacy's full legacy quality suite is both noisy for Code Scanning and
      # exposes an upstream SARIF formatter bug when a non-text asset is touched.
      # CodeQL, Trivy, Scorecard and zizmor cover the other security surfaces.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          # Restrict this workflow to the modern JavaScript analyzer. Quality-only
          # tools such as Stylelint/JSHint stay out of GitHub Security entirely.
          tool: eslint-9
          parallel: 1
          fail-if-incomplete: true
          # Keep Codacy output outside the checkout so the analysis cannot ingest
          # its own partially-written SARIF as an uncommitted repository file.
          output: /tmp/direct-xfer-codacy-results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647
          # Bound individual analyzer execution as well as the whole job timeout.
          tool-timeout: 8minutes

      # GitHub Security is for actionable security findings, not code-style debt.
      # Filter Codacy SARIF before upload. Current security findings use their own
      # codacy-security/* category namespace. Legacy broad quality analyses are
      # removed separately through the Code Scanning API using an exact tool-name
      # allowlist, because historical SARIF identities predate the current category
      # scheme and cannot be reliably retired by synthetic tombstones alone.
      - name: Filter Codacy SARIF for GitHub Security
        shell: bash
        run: |
          set -euo pipefail
          RAW_SARIF=/tmp/direct-xfer-codacy-results.sarif
          SECURITY_SARIF=/tmp/direct-xfer-codacy-security.sarif

          test -s "$RAW_SARIF"
          node scripts/filter-codacy-sarif.js "$RAW_SARIF" "$SECURITY_SARIF"
          test -s "$SECURITY_SARIF"
          jq -e '.version and (.runs | type == "array") and (.runs | length > 0)' "$SECURITY_SARIF" >/dev/null

          run_count="$(jq '.runs | length' "$SECURITY_SARIF")"
          max_results="$(jq '[.runs[].results | length] | max // 0' "$SECURITY_SARIF")"
          unique_count="$(jq '[.runs[].automationDetails.id] | unique | length' "$SECURITY_SARIF")"
          if [ "$run_count" -gt 20 ] || [ "$max_results" -gt 5000 ] || [ "$run_count" -ne "$unique_count" ]; then
            echo "::error::Filtered Codacy SARIF violates GitHub Code Scanning limits or category uniqueness."
            exit 1
          fi

          echo "Filtered Codacy SARIF runs: $run_count; max results/run: $max_results"
          jq -r '.runs[] | "\(.automationDetails.id) tool=\(.tool.driver.name // "tool") security-results=\(.results | length)"' "$SECURITY_SARIF"

      # Current Codacy security findings live in a distinct stable namespace.
      - name: Upload filtered Codacy security results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: /tmp/direct-xfer-codacy-security.sarif

      # The old broad Codacy workflow created thousands of quality analyses under
      # tool identities such as Stylelint/JSHint/CSSLint. They are no longer part
      # of the security workflow. Delete only those explicitly allowlisted legacy
      # analysis series on canonical main; current security tools are never targets.
      - name: Remove legacy Codacy quality analyses
        if: github.event_name != 'pull_request' && github.repository == 'ManixQC/Direct-Xfer' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-legacy-codacy-analyses.js --apply
