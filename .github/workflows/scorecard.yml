name: OpenSSF Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 6'

# OpenSSF Scorecard is a security-specific supply-chain scanner. Its SARIF is
# intentionally sent to Code Scanning. General lint/quality workflows are not.
permissions: read-all

jobs:
  scorecard:
    name: Scorecard security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Filter Scorecard SARIF for Code Scanning
        shell: bash
        run: node scripts/filter-scorecard-sarif.js scorecard-results.sarif scorecard-security.sarif

      - name: Upload full Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-sarif
          path: |
            scorecard-results.sarif
            scorecard-security.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload technical Scorecard security findings to Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-security.sarif
          category: openssf-scorecard
