name: Temporary Direct-Xfer v1.70.23 metadata sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_direct-xfer-bump-1.70.23.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Synchronize Direct-Xfer 1.70.23 release metadata
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const VERSION = '1.70.23';

          function writeJson(file, mutator) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            mutator(value);
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          }
          function replaceRequired(file, from, to) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from) && !text.includes(to)) {
              throw new Error(`${file}: expected release marker not found: ${from}`);
            }
            text = text.split(from).join(to);
            fs.writeFileSync(file, text);
          }
          function replaceAllExisting(file, pairs) {
            let text = fs.readFileSync(file, 'utf8');
            for (const [from, to] of pairs) text = text.split(from).join(to);
            fs.writeFileSync(file, text);
          }
          function walk(dir, fn) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, fn);
              else fn(full);
            }
          }

          writeJson('package.json', (pkg) => { pkg.version = VERSION; });
          writeJson('package-lock.json', (lock) => {
            lock.version = VERSION;
            if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package is missing');
            lock.packages[''].version = VERSION;
          });
          writeJson('oauth-broker/cloudflare-worker/package.json', (pkg) => { pkg.version = VERSION; });

          replaceRequired('installer/Direct-Xfer.iss', '#define AppVersion "1.70.22"', '#define AppVersion "1.70.23"');
          replaceRequired('installer/Direct-Xfer.iss', '..\\dist\\Direct-Xfer-1.70.22-Windows-CSharp', '..\\dist\\Direct-Xfer-1.70.23-Windows-CSharp');

          const workflow = '.github/workflows/build-windows-csharp.yml';
          replaceRequired(workflow, 'run-name: v1.70.22', 'run-name: v1.70.23');
          replaceRequired(workflow, "DX_VERSION: '1.70.22'", "DX_VERSION: '1.70.23'");
          replaceRequired(workflow, 'Direct-Xfer-1.70.22-Windows-CSharp', 'Direct-Xfer-1.70.23-Windows-CSharp');
          replaceRequired(workflow, 'Direct-Xfer-Setup-1.70.22', 'Direct-Xfer-Setup-1.70.23');

          // This release changes the delivered PWA identity. Advance the service-worker
          // generation and app.js cache key while leaving native component identities
          // independently versioned (Launcher 1.70.1, ServerHost 1.70.22).
          walk('pwa', (file) => {
            if (!/\.(?:js|html|json|webmanifest)$/i.test(file)) return;
            replaceAllExisting(file, [
              ['1.70.22', '1.70.23'],
              ['2026.08.23-pwa455', '2026.08.24-pwa456'],
              ['pwa455', 'pwa456'],
              ['app.js?v=441', 'app.js?v=442']
            ]);
          });

          // Tests tracking the current release or PWA shell follow the release/cache marker.
          // Keep native component versions separate; only release-level assertion forms move.
          walk('test', (file) => {
            if (!file.endsWith('.test.js')) return;
            replaceAllExisting(file, [
              ['2026.08.23-pwa455', '2026.08.24-pwa456'],
              ['2026\\.08\\.23-pwa455', '2026\\.08\\.24-pwa456'],
              ['2026\\.08\\.23-pwa456', '2026\\.08\\.24-pwa456'],
              ['pwa455', 'pwa456'],
              ['app.js\\?v=441', 'app.js\\?v=442'],
              ['app\\.js\\?v=441', 'app\\.js\\?v=442'],
              ['app.js?v=441', 'app.js?v=442'],
              ["assert.equal(pkg.version, '1.70.22')", "assert.equal(pkg.version, '1.70.23')"],
              ["assert.equal(packageJson.version, '1.70.22')", "assert.equal(packageJson.version, '1.70.23')"],
              ["/^run-name: v1\\.70\\.22$/m", "/^run-name: v1\\.70\\.23$/m"],
              ["/DX_VERSION: '1\\.70\\.22'/", "/DX_VERSION: '1\\.70\\.23'/"]
            ]);
          });

          // This older PWA regression test pins the application version through a regex
          // rather than assert.equal(), so update both its title and escaped regex form.
          replaceAllExisting('test/pwa-system-health-bottom-nav-1.64.4.test.js', [
            ['application version stays 1.70.22', 'application version stays 1.70.23'],
            ['1\\.70\\.22', '1\\.70\\.23']
          ]);

          // App-release assertions move to 1.70.23. In windows-latest, update only
          // release-level expectations: the ServerHost component intentionally stays
          // at 1.70.22 and its PE/manifest assertions must not be rewritten.
          replaceAllExisting('test/windows-latest-deep-audit-1.66.6.test.js', [
            ["test('1.70.22 version, Windows builds and PWA generation are synchronized'", "test('1.70.23 version, Windows builds and PWA generation are synchronized'"],
            ["assert.equal(lock.version, '1.70.22')", "assert.equal(lock.version, '1.70.23')"],
            ["assert.equal(lock.packages[''].version, '1.70.22')", "assert.equal(lock.packages[''].version, '1.70.23')"],
            ["/1\\.70\\.22|pwa456/", "/1\\.70\\.23|pwa456/"]
          ]);

          replaceAllExisting('test/project-reconstruction-1.64.0.test.js', [
            ["test('Windows metadata keeps app 1.70.22 separate from stable Windows component identities'", "test('Windows metadata keeps app 1.70.23 separate from stable Windows component identities'"],
            ["test('Windows GitHub Actions run name follows Direct-Xfer 1.70.22'", "test('Windows GitHub Actions run name follows Direct-Xfer 1.70.23'"]
          ]);

          for (const file of [
            'test/pwa-mobile-deep-audit-1.64.0.test.js',
            'test/windows-recent-deep-audit-1.66.4.test.js',
            'test/codeql-security-regressions-1.70.22.test.js'
          ]) {
            replaceAllExisting(file, [
              ['1.70.22', '1.70.23'],
              ['1\\.70\\.22', '1\\.70\\.23']
            ]);
          }

          // The historical archive was explicitly removed from the source tree. Keep
          // its integrity test useful when an archive is present without making the
          // normal current-version suite fail merely because the optional archive is absent.
          replaceAllExisting('test/historical-test-manifest-1.64.0.test.js', [
            ["const manifest = JSON.parse(fs.readFileSync(path.join(root, 'test-historical', 'MANIFEST.json'), 'utf8'));", "const manifestPath = path.join(root, 'test-historical', 'MANIFEST.json');\nconst manifest = fs.existsSync(manifestPath) ? JSON.parse(fs.readFileSync(manifestPath, 'utf8')) : null;"],
            ["test('historical test manifest preserves the complete reference test tree', () => {", "test('historical test manifest preserves the complete reference test tree', { skip: !manifest ? 'optional historical archive is not present' : false }, () => {"]
          ]);
          NODE

      - name: Validate synchronized source
        shell: bash
        run: |
          npm ci --ignore-scripts
          node --check lib/auth-utils.js
          node --test test/*.test.js

      - name: Commit synchronized v1.70.23 metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json oauth-broker/cloudflare-worker/package.json installer/Direct-Xfer.iss pwa test
          if git diff --cached --quiet; then
            echo 'No metadata changes required.'
            exit 0
          fi
          git commit -m 'v1.70.23'
          git push origin HEAD:main
