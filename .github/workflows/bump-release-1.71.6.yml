name: Persist Direct-Xfer 1.71.6 Windows workflow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-release-1.71.6.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist-windows-workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize Windows release workflow to 1.71.6
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/build-windows-csharp.yml')
          text = path.read_text(encoding='utf-8')
          updated = text.replace('run-name: v1.71.5', 'run-name: v1.71.6')
          updated = updated.replace("DX_VERSION: '1.71.5'", "DX_VERSION: '1.71.6'")
          if updated == text:
              if 'run-name: v1.71.6' in text and "DX_VERSION: '1.71.6'" in text:
                  print('Windows workflow already synchronized.')
              else:
                  raise RuntimeError('Expected 1.71.5 Windows workflow markers were not found')
          else:
              path.write_text(updated, encoding='utf-8', newline='\n')

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate source and tests against synchronized Windows workflow
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          npm test

      - name: Commit synchronized Windows workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-windows-csharp.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Windows workflow already persisted at 1.71.6.'
            exit 0
          fi
          git commit -m 'v1.71.6 synchronize Windows release workflow'
          git push origin HEAD:main
