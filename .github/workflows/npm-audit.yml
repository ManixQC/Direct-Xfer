name: npm Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-audit.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-audit.yml"
  schedule:
    # Advisory data can change without a repository commit, so re-check daily.
    - cron: "27 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      # Install exactly package-lock.json without executing dependency lifecycle
      # scripts. npm's automatic install-time audit is disabled because the next
      # explicit step is the fail-closed security gate and has a defined threshold.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Fail on Moderate, High or Critical advisories in production dependencies.
      # Keep this read-only: remediation belongs in a reviewed Dependabot/manual PR;
      # this workflow never mutates the dependency tree automatically. Capture JSON
      # first so a red gate always leaves enough evidence to identify the package and
      # advisory instead of exposing only npm's generic exit code 1.
      - name: Run npm audit security gate
        id: npm-audit-gate
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=moderate --json > npm-audit.json
          audit_status=$?
          set -e
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch (error) {
            console.error('npm audit did not return valid JSON:', error.message);
            process.exit(0);
          }
          if (report.error) {
            const code = report.error.code || 'AUDIT_ERROR';
            const summary = report.error.summary || report.error.message || JSON.stringify(report.error);
            console.error(`npm audit registry/tool error [${code}]: ${summary}`);
          }
          const accepted = new Set(['moderate', 'high', 'critical']);
          const rows = Object.entries(report.vulnerabilities || {})
            .filter(([, item]) => accepted.has(String(item && item.severity || '').toLowerCase()))
            .sort((a, b) => String(a[1].severity).localeCompare(String(b[1].severity)) || a[0].localeCompare(b[0]));
          if (rows.length === 0 && !report.error) {
            console.log('npm audit: no Moderate, High or Critical production vulnerability found.');
          }
          for (const [name, item] of rows) {
            const via = Array.isArray(item.via)
              ? item.via.map((entry) => typeof entry === 'string' ? entry : (entry.url || entry.title || entry.source || 'advisory')).join('; ')
              : '';
            console.error(`${String(item.severity).toUpperCase()} ${name}${item.range ? ` ${item.range}` : ''}${via ? ` — ${via}` : ''}`);
          }
          const counts = report.metadata && report.metadata.vulnerabilities;
          if (counts) console.log('npm audit severity counts:', JSON.stringify(counts));
          NODE

      - name: Upload npm audit report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce npm audit security gate
        if: steps.npm-audit-gate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "npm audit detected a Moderate-or-higher production advisory or the audit service failed."
          echo "See the npm-audit-report artifact and the diagnostic output above."
          exit 1
